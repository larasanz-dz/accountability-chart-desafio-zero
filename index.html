<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Accountability Chart — Desafío Zero</title>
<style>
:root{
  --bg:#f4f5f7; --canvas:#eef0f3; --panel:#ffffff; --ink:#18202b; --ink2:#3a4554; --muted:#6a7482;
  --border:#dde1e7; --border2:#c9ced6; --line:#9aa3b0; --accent:#2e5b88; --accent-bg:#e8eff7;
  --warn:#a65a00; --warn-bg:#fff3e0; --warn-bd:#f0c98f;
  --pend:#5d5a8c; --pend-bg:#f1f0f8; --pend-bd:#b9b5dc;
  --ok:#2d6a4f; --mark:#ffe58a;
  --lead-bg:#1f2b3a; --lead-ink:#f3f5f8; --lead-muted:#aab6c5;
  --shadow:0 1px 2px rgba(20,30,45,.06),0 1px 1px rgba(20,30,45,.04);
  --shadow-hi:0 0 0 3px rgba(46,91,136,.35);
  --a1:#2f7f7a; --a2:#3a67a8; --a3:#b0702c; --a4:#6f5ea8; --a5:#7d8590; --a6:#8a5a44;
  --cw:330px; --colw:440px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181e; --canvas:#101318; --panel:#1c2129; --ink:#e8ecf1; --ink2:#c5ccd6; --muted:#8e98a6;
    --border:#2c333d; --border2:#3a424e; --line:#5b6573; --accent:#7fa8d6; --accent-bg:#1f2c3b;
    --warn:#f0b35e; --warn-bg:#2d2213; --warn-bd:#6b4d20;
    --pend:#b3aee6; --pend-bg:#23223a; --pend-bd:#4d4880;
    --mark:#7a6415; --lead-bg:#2a3748; --lead-ink:#f3f5f8; --lead-muted:#a9b6c6;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#14181e; --canvas:#101318; --panel:#1c2129; --ink:#e8ecf1; --ink2:#c5ccd6; --muted:#8e98a6;
  --border:#2c333d; --border2:#3a424e; --line:#5b6573; --accent:#7fa8d6; --accent-bg:#1f2c3b;
  --warn:#f0b35e; --warn-bg:#2d2213; --warn-bd:#6b4d20;
  --pend:#b3aee6; --pend-bg:#23223a; --pend-bd:#4d4880;
  --mark:#7a6415; --lead-bg:#2a3748; --lead-ink:#f3f5f8; --lead-muted:#a9b6c6;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15.5px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* ---------- header ---------- */
.top{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 16px 8px;flex:none;z-index:5}
.title-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:8px}
.title-row h1{font-size:18px;margin:0;font-weight:650;letter-spacing:-.01em}
.draft{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--warn);border:1px solid var(--warn-bd);background:var(--warn-bg);padding:1px 7px;border-radius:4px}
.version{font-size:13.5px;color:var(--muted)}
.version button{border:0;background:none;color:var(--accent);padding:0;text-decoration:underline}
.stats{font-size:14px;color:var(--ink2);margin-left:auto}
.stats b{font-weight:650;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.btn,.toolbar select{height:34px;border:1px solid var(--border2);background:var(--panel);border-radius:7px;padding:0 12px;font-size:14.5px;white-space:nowrap}
.btn:hover{background:var(--accent-bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
:root[data-theme="dark"] .btn.primary{color:#0e1620}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0e1620}}
.btn .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:1px}
.search{display:flex;align-items:center;gap:4px;flex:1 1 280px;max-width:420px}
.search input{flex:1;height:34px;border:1px solid var(--border2);border-radius:6px;padding:0 10px;background:var(--panel);min-width:0}
.search .qc{font-size:13px;color:var(--muted);min-width:34px;text-align:center}
.search .btn{padding:0 8px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:14.5px;height:34px;padding:0 8px;border:1px solid var(--border2);border-radius:6px;background:var(--panel);user-select:none;cursor:pointer}
.chk input{margin:0}
.sep{width:1px;height:22px;background:var(--border);margin:0 2px}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

/* ---------- canvas ---------- */
.tabs{display:flex;gap:2px;margin:2px 0 10px;border-bottom:1px solid var(--border)}
.tab{border:1px solid transparent;border-bottom:0;background:transparent;border-radius:8px 8px 0 0;padding:7px 16px;font-size:15px;font-weight:600;color:var(--muted);margin-bottom:-1px}
.tab:hover{color:var(--ink);background:var(--accent-bg)}
.tab[aria-selected="true"]{color:var(--ink);background:var(--panel);border-color:var(--border);border-bottom:1px solid var(--panel);box-shadow:inset 0 3px 0 var(--accent)}
.tab .sub{font-weight:500;color:var(--muted);font-size:13px;margin-left:6px}
body.guide-mode .top{padding-bottom:0}
body.guide-mode .tabs{margin-bottom:0}
.guide-view{flex:1;overflow:auto;background:var(--canvas);padding:28px 16px 80px}
.gv{max-width:900px;margin:0 auto;font-size:16px;line-height:1.55}
.gv-title{font-size:26px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em}
.gv-src{font-size:13px;color:var(--muted);margin-bottom:18px}
.gv-lead{font-size:17.5px;background:var(--panel);border:1px solid var(--border);border-left:5px solid var(--accent);border-radius:10px;padding:16px 20px;margin:0 0 18px}
.gv-toc{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 22px}
.gv-toc button{border:1px solid var(--border2);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:13.5px;color:var(--ink2)}
.gv-toc button:hover{background:var(--accent-bg);color:var(--accent)}
.gv-sec{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 22px;margin:0 0 16px;box-shadow:var(--shadow);scroll-margin-top:12px}
.gv-sec h3{font-size:18px;margin:0 0 12px;letter-spacing:-.005em}
.gv-sec p{margin:0 0 10px}
.gv-sec p:last-child{margin-bottom:0}
.gv-callout{background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:8px;padding:10px 14px;margin:12px 0}
.gv-note{color:var(--ink2);font-size:15px;border-left:3px solid var(--border2);padding-left:12px;margin:12px 0}
.gv-rule{background:var(--lead-bg);color:var(--lead-ink);border-color:var(--lead-bg)}
.gv-rule h3{color:var(--lead-ink)}
.gv-table{width:100%;border-collapse:collapse;margin:4px 0 8px;font-size:15px}
.gv-table th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;padding:6px 10px 6px 0;border-bottom:1.5px solid var(--border2)}
.gv-table td{padding:9px 12px 9px 0;border-bottom:1px solid var(--border);vertical-align:top;white-space:pre-wrap}
.gv-table tr:last-child td{border-bottom:0}
.gv-table td:first-child{font-weight:650;width:30%}
.gv-steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.gv-steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.gv-steps .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.gv-steps b{display:block}
.gv-check{list-style:none;margin:0;padding:0}
.gv-check li{padding:7px 0 7px 30px;position:relative;border-bottom:1px solid var(--border)}
.gv-check li:last-child{border-bottom:0}
.gv-check li::before{content:"";position:absolute;left:2px;top:10px;width:16px;height:16px;border:1.5px solid var(--border2);border-radius:4px}
.gv-chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px 4px}
.gv-chain span{background:var(--accent-bg);border:1px solid var(--border2);border-radius:6px;padding:2px 9px;font-size:14px;font-weight:500}
.gv-chain i{font-style:normal;color:var(--muted)}
.gv-empty{max-width:600px;margin:40px auto;text-align:center;color:var(--muted)}
#viewport{position:relative;flex:1;overflow:hidden;background:var(--canvas);touch-action:none;cursor:grab}
#viewport.dragging{cursor:grabbing}
#stage{position:absolute;left:0;top:0;transform-origin:0 0;display:flex;align-items:flex-start;gap:80px;padding:28px 32px 120px;will-change:transform}
#stage.anim{transition:transform .28s ease}

/* horizontal tree levels */
.node{display:flex;flex-direction:column}
.hnode{align-items:center}
.hnode>.card{width:var(--cw)}
.hnode.col{width:var(--colw);align-items:stretch}
.hnode.col>.card{width:100%}
.hkids{display:flex;align-items:flex-start;justify-content:center;position:relative;padding-top:20px}
.hkids::before{content:"";position:absolute;top:0;left:50%;height:20px;border-left:1.5px solid var(--line)}
.hkid{position:relative;padding:20px 16px 0;display:flex;flex-direction:column;align-items:center}
.hkid::before,.hkid::after{content:"";position:absolute;top:0;right:50%;width:50%;height:20px;border-top:1.5px solid var(--line)}
.hkid::after{right:auto;left:50%;border-left:1.5px solid var(--line)}
.hkid:only-child{padding-top:0}
.hkid:only-child::before,.hkid:only-child::after{display:none}
.hkid:first-child::before,.hkid:last-child::after{border:0 none}
.hkid:last-child::before{border-right:1.5px solid var(--line);border-top-right-radius:6px}
.hkid:first-child::after{border-top-left-radius:6px}
/* vertical seat lists */
.vnode{align-items:stretch}
.vnode>.card{width:100%}
.vkids{margin-left:14px;padding-top:2px}
.vkid{position:relative;padding:10px 0 0 16px}
.vkid::before{content:"";position:absolute;left:0;top:0;width:14px;height:42px;border-left:1.5px solid var(--line);border-bottom:1.5px solid var(--line);border-bottom-left-radius:6px}
.vkid:not(:last-child)::after{content:"";position:absolute;left:0;top:0;bottom:0;border-left:1.5px solid var(--line)}
.vkids.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-left:14px;padding:10px 0 2px 12px;border-left:1.5px solid var(--line);border-bottom-left-radius:6px}
.vcell{min-width:0}
.card.compact{padding:7px 8px 6px 10px}
.card.compact .card-top{flex-wrap:nowrap;align-items:flex-start}
.card.compact .seat{font-size:14px;margin:0 0 3px;flex:1;min-width:0}
.card.compact .person{min-height:26px;gap:5px}
.card.compact .person .chip.soft{display:none}
.card.compact .avatar{width:22px;height:22px;font-size:11px}
.card.compact .pname{font-size:13.5px;white-space:nowrap;overflow:visible;text-overflow:clip}
.card.compact .person{align-items:flex-start}
.card.compact .person .pr{margin-top:1px}
.card.compact .p-empty{display:none}
.card.compact .ibtn{padding:1px 6px;font-size:12.5px}
.card.compact .toggle{width:24px;height:22px}
.card.compact .xl{padding-left:0}
.card.compact .chip{padding:0 5px}
.roots{display:flex;gap:48px;align-items:flex-start}

/* pending zone */
.pending-zone{width:calc(var(--colw) + 28px);border:1.5px dashed var(--pend-bd);border-radius:12px;padding:14px;background:color-mix(in srgb,var(--pend-bg) 55%,transparent)}
.pending-zone h2{font-size:13px;margin:0 0 2px;color:var(--pend);letter-spacing:.02em}
.pending-zone p{margin:0 0 12px;font-size:12px;color:var(--muted)}
.pz-list{display:flex;flex-direction:column;gap:12px}

/* ---------- card ---------- */
.card{position:relative;background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--ac,var(--a5));border-radius:8px;box-shadow:var(--shadow);padding:9px 10px 9px 12px;cursor:default;transition:opacity .15s, box-shadow .15s}
.card.head{border-top:1px solid var(--border);background:linear-gradient(var(--panel),var(--panel)) padding-box}
.card.head .seat{font-size:17.5px}
.card.lead{background:var(--lead-bg);color:var(--lead-ink);border-color:var(--lead-bg);border-left-color:var(--lead-bg)}
.card.lead .area,.card.lead .xl,.card.lead .p-empty{color:var(--lead-muted)}
.card.lead .seat{font-size:19px}
.card.lead .ibtn,.card.lead .toggle,.card.lead .kids-toggle{color:var(--lead-ink);border-color:rgba(255,255,255,.22)}
.card.lead .ibtn:hover,.card.lead .toggle:hover,.card.lead .kids-toggle:hover{background:rgba(255,255,255,.1)}
.card.lead .avatar{background:rgba(255,255,255,.14);color:var(--lead-ink)}
.card.lead .resp-list li::marker,.card.lead .acc .lbl{color:var(--lead-muted)}
.card.lead .acc{border-color:rgba(255,255,255,.15)}
.card.lead a.link,.card.lead .link{color:#b9d3f0}
.card.pending{border-style:dashed;border-left-style:solid;border-color:var(--pend-bd);border-left-color:var(--pend)}
.card.dim{opacity:.28}
.card.hit{box-shadow:var(--shadow-hi)}
.card.hit.cur{box-shadow:0 0 0 3px var(--accent)}
.card-top{display:flex;align-items:center;gap:6px;min-height:18px}
.area{font-size:12px;font-weight:650;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;white-space:nowrap;border:1px solid transparent;line-height:18px}
button.chip{cursor:pointer}
.chip.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.chip.pend{color:var(--pend);background:var(--pend-bg);border-color:var(--pend-bd)}
.chip.soft{color:var(--muted);background:transparent;border-color:var(--border2)}
.card.lead .chip.soft{color:var(--lead-muted);border-color:rgba(255,255,255,.25)}
.seat{font-size:16.5px;font-weight:650;margin:2px 0 5px;line-height:1.28;letter-spacing:-.005em;overflow-wrap:anywhere}
.person{display:flex;align-items:center;gap:6px;min-height:26px;flex-wrap:nowrap;min-width:0}
.pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--accent-bg);color:var(--accent);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex:none}
.avatar.empty{background:transparent;border:1.5px dashed var(--border2);color:var(--muted)}
.pname{font-weight:600;font-size:15px}
.avatar.multi{background:var(--pend-bg);color:var(--pend);font-size:11.5px}
.p-multi{font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.names{list-style:none;margin:5px 0 2px;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.names li{font-size:13px;font-weight:500;background:var(--accent-bg);border:1px solid var(--border);border-radius:5px;padding:1px 7px}
.card.lead .names li{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.2)}
.p-empty{color:var(--muted);font-size:14.5px;white-space:nowrap}
.ibtn{white-space:nowrap}
.card.pending .area{flex-basis:100%}
.card-top{flex-wrap:wrap}
.p-warn{color:var(--warn);font-weight:600;font-size:14.5px}
.xl{font-size:13px;color:var(--muted);padding-left:33px;margin-top:1px}
.ibtn{border:1px solid var(--border2);background:transparent;border-radius:6px;font-size:13.5px;padding:2px 9px;line-height:20px}
.ibtn:hover{background:var(--accent-bg)}
.ibtn.assign{border-color:var(--accent);color:var(--accent);font-weight:600}
.ibtn.edit{padding:1px 6px}
.card-foot{display:flex;align-items:center;gap:6px;margin:4px 0 -2px -6px}
.pr{margin-left:auto;display:inline-flex;align-items:center;gap:5px}
.toggle,.kids-toggle{border:1px solid transparent;background:transparent;border-radius:6px;font-size:13px;color:var(--ink2);padding:2px 6px;display:inline-flex;align-items:center;gap:5px}
.toggle:hover,.kids-toggle:hover{background:var(--accent-bg)}
.toggle{width:28px;height:26px;justify-content:center;border-color:var(--border2);font-size:11px;padding:0}
.toggle[aria-expanded="true"]{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.card.lead .toggle[aria-expanded="true"]{background:rgba(255,255,255,.14);color:var(--lead-ink)}
.kids-toggle{white-space:nowrap}
.kids-toggle{color:var(--muted)}
.resp{margin-top:6px;border-top:1px solid var(--border);padding-top:8px}
.card.lead .resp{border-color:rgba(255,255,255,.15)}
.resp-list{margin:0;padding-left:22px;font-size:14.5px;line-height:1.45}
.resp-list li{margin:0 0 5px;padding-left:2px}
.resp-list li::marker{font-weight:700;color:var(--muted)}
.resp-list li.hitline{background:color-mix(in srgb,var(--mark) 35%,transparent);border-radius:3px}
.resp-bad{font-size:14px;color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-bd);border-radius:6px;padding:6px 8px;margin-bottom:6px}
.raw{font-size:14px;white-space:pre-wrap;color:var(--ink2);border-left:3px solid var(--border2);padding:2px 0 2px 8px;margin-bottom:4px}
.acc{margin-top:8px;border-top:1px dashed var(--border);padding-top:7px;font-size:13.5px;color:var(--ink2)}
.acc .lbl{font-size:11.5px;font-weight:650;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:block;margin-bottom:2px}
.card.lead .acc{color:var(--lead-muted)}
.link{border:0;background:none;padding:0;color:var(--accent);font-size:14px;text-decoration:underline;text-underline-offset:2px}
.resp .link{margin-top:6px;display:inline-block}

/* zoom + legend */
.zoom{position:absolute;right:14px;bottom:14px;display:flex;gap:4px;align-items:center;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:4px;box-shadow:var(--shadow);z-index:3}
.zoom .btn{height:28px;min-width:30px;padding:0 8px}
.zoom .zl{font-size:13.5px;color:var(--muted);min-width:42px;text-align:center}
.legend{position:absolute;left:14px;bottom:14px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 11px;font-size:13px;color:var(--ink2);display:flex;gap:12px;flex-wrap:wrap;align-items:center;box-shadow:var(--shadow);z-index:3;max-width:calc(100% - 260px)}
.legend .sw{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.hint{font-size:12.5px;color:var(--muted)}

/* drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100vw);background:var(--panel);border-left:1px solid var(--border);box-shadow:-8px 0 24px rgba(0,0,0,.08);z-index:20;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .2s ease}
.drawer.open{transform:none}
.drawer header{padding:14px 16px 10px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.drawer header .t{flex:1;min-width:0}
.drawer header h2{margin:2px 0 0;font-size:19px;line-height:1.3}
.drawer .x{border:1px solid var(--border2);background:transparent;border-radius:6px;width:30px;height:30px;font-size:16px;flex:none}
.drawer .body{overflow:auto;padding:12px 16px 40px;flex:1}
.drawer h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:18px 0 6px}
.drawer dl{margin:0}
.drawer dt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:650;margin-top:14px}
.drawer dd{margin:3px 0 0;white-space:pre-wrap;font-size:15px}
.drawer dd.none{color:var(--muted);font-style:italic}
.issue{font-size:14.5px;border-radius:6px;padding:6px 9px;margin:0 0 6px;border:1px solid var(--border)}
.issue.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--ink)}
.issue.pending{background:var(--pend-bg);border-color:var(--pend-bd)}
.issue.multi{background:var(--accent-bg);border-color:var(--border2)}
.issue.info{color:var(--ink2)}
.issue .src{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.rv-seat{border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.rv-seat .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.rv-seat .h b{font-size:15px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14.5px}

os y problemas interdepartamentales\n4. Asegurar accountability, ejecución, ritmo y resultados\n5. Liderar, gestionar y desarrollar al equipo directivo (LMA)", "Integra la visión con la ejecución de la empresa, asegurando la alineación entre las distintas áreas, el accountability, el ritmo de ejecución y el funcionamiento coordinado del equipo directivo.", "¿Estamos funcionando como un solo equipo, ejecutando nuestras prioridades y consiguiendo los resultados acordados?", "Asegurar que la empresa ejecuta la visión de forma coordinada, que las áreas están alineadas y que existe accountability, ritmo y resolución efectiva de los problemas que afectan al conjunto de la organización.", "Integración de visión y operación; coordinación de las Funciones Principales; alineación del equipo directivo; resolución de problemas y bloqueos interdepartamentales; seguimiento de prioridades y resultados; sistema de gestión y ritmo de ejecución; L10 y procesos de accountability; LMA del equipo directivo; identificación y resolución de problemas sistémicos; evolución de la cultura y forma de trabajo de la organización. Coordinación de los procesos de personas del equipo interno (incorporación, evaluación con People Analyzer) mientras no exista un asiento de Personas.", "", "Estrategico/analítico", "Lara", "", "", "", "Visionario"], ["Administración y finanzas", "Lider Administración y finanzas", "1. Definir la estrategia y los criterios financieros de la empresa y asegurar que el área de Administración y finanzas funciona como sistema.\n2. Asegurar que la empresa mantiene liquidez suficiente para cumplir sus compromisos y anticipa sus necesidades de caja.\n3. Asegurar que existen presupuesto y previsiones actualizados y que las desviaciones se detectan y explican a tiempo.\n4. Asegurar que dirección dispone de información financiera fiable (P&L, caja, rentabilidad) para tomar decisiones.\n5. Asegurar que las necesidades de financiación están identificadas, dimensionadas y cubiertas en que la necesidad esté identificada, dimensionada y cubierta. Señal para volver a separar Tesorería y control: que este asiento se convierta en cuello de botella (previsiones sin actualizar o desviaciones detectadas tarde de forma recurrente).", "Previsión de caja a 13 semanas (semanas cubiertas)\n\nResultado neto mensual vs. presupuesto", "Caja: si la liquidez prevista cubre los compromisos de las próximas semanas.\n\nResultado: si la empresa gana o pierde dinero y cuánto se desvía de lo presupuestado.", "Integrador"], ["Administración y finanzas", "Administración y contabilidad de empresa", "\n1        Asegurar que la contabilidad mensual de la empresa está completa, correcta y conciliada.\n2        Asegurar que los gastos, pagos y cobros de la estructura de la empresa están correctamente gestionados.\n3        Asegurar que la gestión administrativa y laboral de la empresa está correctamente gestionada y al día.\n4        Asegurar que el cierre mensual de la empresa está completo, correcto y disponible en plazo.\n5        Asegurar la correcta coordinación administrativa y contable con la gestoría.", "Asegura que la contabilidad, administración y gestión económica de la estructura de Desafío Zero están correctamente gestionadas, actualizadas y coordinadas con la gestoría.", "¿Tenemos la contabilidad y administración de la empresa al día, correctamente registradas y cerradas?", "Asegurar que la contabilidad y administración de la empresa están completas, correctas y al día.", "Contabilidad mensual; registro y conciliación contable; gastos, pagos y cobros de la estructura de la empresa; administración general; gestión administrativa laboral; cierre contable; coordinación con la gestoría; documentación administrativa y contable.", "Tesorería y control financiero (Función principal Administración y finanzas); análisis de rentabilidad y desviaciones; presupuesto y previsiones financieras; gestión económica específica de expediciones; fiscalidad; decisiones de financiación.", "Operativo/ejecutor", "Rubén", "Se ocupa de que la información administrativa y contable de la empresa esté correctamente registrada y disponible. El análisis financiero y la toma de decisiones económicas corresponden a la Función principal Administración y finanzas.", "", "", "Función principal Administración y finanzas"], ["Administración y finanzas", "Gestión económica de expediciones", "1. Asegurar que cada expedición cobra todos los ingresos que le corresponden.\n2. Asegurar que cada expedición paga y registra correctamente todos sus costes.\n3. Asegurar la correcta liquidación económica con líderes, embajadores y demás colaboradores de cada expedición.\n4. Asegurar que cada expedición tiene su expediente económico completo y correctamente documentado.\n5. Asegurar que cada expedición se cierra con su margen real conocido.", "Asegura que cada expedición tiene correctamente gestionados, registrados y cerrados todos sus ingresos, costes y liquidaciones, permitiendo conocer el resultado económico real de cada expedición.", "¿Sabemos cuánto ha ingresado, cuánto ha costado y cuánto ha ganado realmente cada expedición?", "Asegurar que cada expedición tiene sus ingresos y costes correctamente registrados y liquidados y que su margen real es conocido al cierre.", "Seguimiento de ingresos y costes por expedición; registro y documentación de gastos; liquidaciones con líderes, embajadores y colaboradores; expediente económico de cada expedición; conciliación de ingresos y costes; cierre económico; cálculo del margen real por expedición.", "Contabilidad general de la empresa; tesorería global; presupuesto de la empresa; fiscalidad; definición de precios; gestión comercial de las expediciones; financiación.", "Operativo/ejecutor", "Pura", "Se centra en el resultado económico de cada expedición de forma individual. El control financiero global de la empresa corresponde a la Función principal Administración y finanzas.", "", "", "Función principal Administración y finanzas"], ["Administración y finanzas", "Fiscalidad", "\n1\tAsegurar el cumplimiento de las obligaciones fiscales de la empresa\n2\tSupervisar el cálculo, presentación y pago de impuestos\n3\tAsegurar el correcto tratamiento fiscal de las operaciones de la empresa\n4\tCoordinar la relación con asesores y organismos fiscales\n5\tAnticipar y gestionar riesgos y cambios relevantes en materia fiscal", "Se asegura de que la empresa calcula, presenta y paga correctamente sus impuestos y cumple sus obligaciones fiscales.", "¿Estamos cumpliendo correctamente nuestras obligaciones fiscales?", "Asegurar el cumplimiento correcto y en plazo de las obligaciones fiscales de la empresa.", "Preparación y coordinación de declaraciones.\nRevisión del tratamiento fiscal de operaciones.\nCalendario y seguimiento de obligaciones fiscales.\nCoordinación con gestoría/asesoría fiscal.\nRequerimientos e incidencias con Hacienda.\nSeguimiento de cambios normativos con impacto en DZ.\nIdentificación de riesgos fiscales.", "Contabilidad y cierres → Contabilidad & Administración.\nGestión de caja → Función principal Administración y finanzas.\nEjecución de pagos → Cobros y Pagos.\nEstrategia financiera global → Dirección Financiera.\nGestión laboral → Gestión Laboral.", "Especialista/Técnico", "Rubén", "", "% de obligaciones fiscales presentadas y pagadas en plazo", "Cumplimiento de las obligaciones fiscales.", "Función principal Administración y finanzas"], ["Operaciones", "Legal y cumplimiento", "1. Asegurar que las necesidades legales de la empresa están identificadas, gestionadas y cubiertas adecuadamente.\n2. Gestionar los contratos y obligaciones legales de la empresa.\n3. Asegurar el cumplimiento de las obligaciones legales y regulatorias aplicables.\n4. Asegurar que la empresa cuenta con el asesoramiento legal necesario para gestionar sus obligaciones y riesgos.\n5. Identificar y gestionar los riesgos legales de la empresa.", "Asegura que las decisiones y actividades de la empresa se realizan conforme al marco legal aplicable y gestiona las necesidades jurídicas de la empresa.", "¿Estamos identificando y gestionando adecuadamente las obligaciones y riesgos legales de la empresa?", "Asegurar que las necesidades legales de la empresa están identificadas, gestionadas y cubiertas adecuadamente.", "Contratos; revisión y negociación de acuerdos; protección de datos; términos y condiciones; propiedad intelectual; reclamaciones y conflictos; asesoramiento jurídico; coordinación con asesores legales externos.", "", "Especialista/Técnico", "Oliver", "", "", "", "Función principal administración y finanzas"], ["Operaciones", "Líder Operaciones", "1        Definir y asegurar la ejecución de la estrategia operativa\n2        Asegurar la calidad de la experiencia y el cumplimiento de los estándares de Desafío Zero\n3        Planificar y asegurar la capacidad y los recursos necesarios para la operación\n4        Asegurar la eficiencia y sostenibilidad económica de la operación\n5        Supervisar el desempeño operativo, gestionar riesgos e incidentes y asegurar la mejora continua.", "Asegurar el correcto funcionamiento global de Operaciones, equilibrando calidad de experiencia, capacidad, eficiencia y escalabilidad, y garantizando que los procesos operativos están definidos, documentados, comunicados y correctamente implantados en el equipo.", "¿La operación funciona de forma eficiente, escalable y alineada con la experiencia que queremos ofrecer?", "Asegurar el correcto funcionamiento global de Operaciones, equilibrando calidad de experiencia, capacidad, eficiencia y escalabilidad.", "Estrategia y planificación operativa.\nCapacidad de expediciones y recursos necesarios.\nCalidad y estándares de operación.\nSeguimiento de resultados operativos.\nGestión de riesgos operativos.\nGestión y coordinación de incidentes graves y situaciones de emergencia.\nProtocolos de actuación y escalado.\nCoordinación de asistencia/seguro cuando corresponda.\nRevisión y aprendizaje posterior a incidentes.\nEvaluar y proponer la viabilidad operativa de cada expedición y activar el proceso de decisión go/no-go según los criterios establecidos.\nCoordinación con Finanzas para evaluar impacto económico de decisiones operativas.", "Gestión diaria de reservas y proveedores → Logística, Reservas y Proveedores.\nDiseño y evolución de productos/destinos → Producto y Destinos.\nAtención directa al viajero → Gestión y atención al viajero.\nLiderazgo de una expedición concreta → Liderazgo de Expediciones.\nSelección, formación y desarrollo de líderes → Gestión y Desarrollo de Líderes.\nRegistro, seguimiento y control financiero → Finanzas.\nDirección de Operaciones es responsable de decidir y coordinar ante incidentes graves; no significa que gestione personalmente cada incidencia.", "Estrategico/analítico", "Oliver", "", "", "", "Integrador"], ["Operaciones", "Gestión y atención al viajero", "1. Asegurar que cada viajero cumple en plazo los requisitos, documentación, contratos y pagos necesarios para su expedición.\n2. Asegurar que cada viajero dispone de la información y los servicios necesarios para realizar correctamente su expedición.\n3. Asegurar que las consultas, solicitudes e incidencias de los viajeros se atienden y quedan trazadas hasta su cierre.\n4. Asegurar que modificaciones, cancelaciones y reembolsos se gestionan conforme a las condiciones establecidas.\n5. Asegurar el cierre de la relación operativa con cada viajero y que su feedback llega a las áreas responsables.", "Gestiona la relación operativa y la atención de cada viajero desde la reserva hasta el cierre posterior a la expedición: que esté preparado para viajar, informado y atendido, con cada caso trazado hasta su cierre y con una atención coherente con los estándares DZ.", "¿Cada viajero llega preparado a su expedición y está bien atendido durante toda su relación con Desafío Zero?", "Asegurar que cada viajero está correctamente preparado, informado y atendido desde la reserva hasta el cierre de su expedición, con todos sus casos gestionados y trazados.", "Seguimiento del estado de cada reserva; contratos y firmas pendientes; seguimiento operativo de pagos pendientes del viajero; documentación necesaria para viajar; información pre-expedición; modificaciones, cancelaciones y gestión operativa de reembolsos; punto de contacto y atención individual al viajero; consultas, solicitudes e incidencias; registro, trazabilidad y escalado de casos; recogida de feedback durante y después de la experiencia; identificación de patrones y traslado de aprendizajes a Operaciones, Producto y Marketing; cierre operativo tras la expedición.", "Cobro, registro y conciliación de pagos → Gestión económica de expediciones.\nContabilidad → Administración y contabilidad de empresa.\nDiseño de producto, cambios de itinerario y alternativas → Producto y expediciones.\nReservas y proveedores de la expedición → Logística, reservas y proveedores.\nIncidencias que requieren actuación presencial → Liderazgo de expediciones (con escalado).\nIncidentes graves → Función principal Operaciones.\nVenta antes de la reserva → Ventas y conversión.\nComunicación masiva, fidelización, reactivación y reseñas públicas → Comunicación comercial.", "Operativo/ejecutor", "Karola", "Fusiona Experiencia del viajero y Operaciones del viajero. Para el viajero es una única relación: si algo falla entre la reserva y el cierre, debe haber un solo asiento accountable. La resolución de fondo corresponde al área responsable según la naturaleza del caso; este asiento responde de la gestión y trazabilidad hasta el cierre.", "% de viajeros con requisitos completos antes de la fecha límite\n\n% de casos respondidos dentro del SLA", "Preparación: si los viajeros llegan listos a su expedición.\n\nAtención: si respondemos y damos seguimiento al viajero en el tiempo establecido.", "Función principal Operaciones"], ["Operaciones", "Producto y expediciones", "1        Definir los criterios, estándares y principios de producto de Desafío Zero.\n2        Diseñar, mantener y mejorar productos, destinos, itinerarios, actividades y experiencias.\n3        Asegurar la viabilidad operativa de cada producto/destino, incluyendo alternativas y planes B.\n4        Asegurar que cada producto y destino está preparado para ser ejecutado conforme a los estándares definidos.\n5        Recoger aprendizajes de las expediciones y asegurar la evolución y mejora continua.", "Define y asegura el sistema, criterios y estándares de producto de Desafío Zero, y supervisa que los productos y destinos estén bien construidos, alineados con dichos estándares y evolucionen a partir de los aprendizajes de las expediciones.", "¿Estamos creando y manteniendo productos y destinos que representan correctamente la experiencia Desafío Zero y cumplen nuestros estándares?", "Asegurar que cada producto y destino de Desafío Zero está bien construido, es viable y diferencial, representa el estándar de experiencia de DZ y evoluciona a partir de su ejecución y aprendizaje.", "Definición de criterios y estándares de producto; diseño y evolución del sistema de producto; revisión de destinos y experiencias; acompañamiento y supervisión de los embajadores; coherencia entre destinos y experiencia DZ; revisión de aprendizajes; identificación de mejoras; validación de que cada producto/destino está preparado para ser ejecutado; coordinación con Operaciones y otras áreas cuando el desarrollo del producto lo requiera.\n\nDentro de esta función, el rol de Embajador es responsable de desarrollar y mantener un proyecto/destino concreto, asegurando que su experiencia, programa, conocimiento del destino, proveedores, alternativas y aprendizajes estén alineados con los estándares de DZ. El Embajador es la referencia para los Líderes que ejecutan expediciones de ese destino.", "Liderar o ejecutar una expedición concreta; gestión operativa diaria de reservas y proveedores, aunque el Embajador pueda participar en ellas para asegurar el correcto desarrollo del destino; atención y soporte directo al viajero; gestión, desarrollo y evaluación de la red de líderes; venta y conversión comercial; gestión financiera y contable de las expediciones; definición de la estrategia global de Operaciones.", "Estrategico/analítico", "Oliver", "Actualmente los embajadores también gestionan parte de la logística y reservas del destino. Esta responsabilidad se prevé centralizar progresivamente en Logística, Reservas y Proveedores, manteniendo en Producto y Destinos el criterio experto sobre el destino y la toma de decisiones sobre alternativas o planes B. El rol de Embajador se desarrolla dentro de este asiento. Cada Embajador es responsable de uno o varios proyectos/destinos concretos y actúa como referencia del producto para los Líderes de Expedición que lo ejecutan.", "", "", "Función principal Operaciones"], ["Operaciones", "Embajador Azores", "", "", "", "", "", "", "", "Tali", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Marruecos", "", "", "", "", "", "", "", "Karola", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Camino de Santiago", "", "", "", "", "", "", "", "Sara", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Indonesia", "", "", "", "", "", "", "", "Saru", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Irlanda", "", "", "", "", "", "", "", "Helena", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Senegal", "", "", "", "", "", "", "", "Andrea", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Transilvania", "", "", "", "", "", "", "", "Alberto", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Sicilia", "", "", "", "", "", "", "", "Sara", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Japon", "", "", "", "", "", "", "", "Saru", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Tailandia", "", "", "", "", "", "", "", "Saru", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador China", "", "", "", "", "", "", "", "Saru", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Prineos", "", "", "", "", "", "", "", "Pedrito", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Turquia", "", "", "", "", "", "", "", "Saru", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Patagonia", "", "", "", "", "", "", "", "Miguel", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Peru", "", "", "", "", "", "", "", "Pol", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Islandia", "", "", "", "", "", "", "", "Almudena", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Laponia", "", "", "", "", "", "", "", "Pedrito", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Sri Lanka", "", "", "", "", "", "", "", "Ania", "", "", "", "Producto y expediciones"], ["Operaciones", "Embajador Senegal Verano (Casamance)", "", "", "", "", "", "", "", "Tina", "", "", "", "Producto y expediciones"], ["Operaciones", "Logística", "1\tGestionar y centralizar las reservas y servicios necesarios para las expediciones\n2\tGestionar la relación operativa con proveedores\n3\tAsegurar la disponibilidad de recursos y servicios en plazo y condiciones acordadas\n4\tMantener la documentación y trazabilidad de reservas, proveedores y condiciones operativas\n5\tResolver y dar soporte remoto a las necesidades logísticas de las expediciones", "Centraliza y gestiona la logística, reservas y relaciones operativas con proveedores para ejecutar las expediciones de forma eficiente, trazable y escalable.", "¿Tenemos la logística y las reservas organizadas y centralizadas para ejecutar las expediciones correctamente?", "Asegurar que las reservas, proveedores y recursos logísticos necesarios para las expediciones están correctamente gestionados, centralizados y disponibles en plazo, dando soporte remoto al líder durante la expedición cuando las gestiones puedan resolverse desde el equipo interno.", "Reservas centralizadas; hoteles; transportes; vuelos internos; actividades; gestión de proveedores; condiciones y contratos; costes negociados; calendario de reservas y pagos; documentación; gestión de incidencias con proveedores; repositorio único de información operativa; soporte operativo remoto al líder: reservas, cambios, check-ins, billetes, proveedores y otras gestiones que puedan resolverse desde el equipo interno.", "Diseñar el producto o destino; decidir qué experiencia debe ofrecer el producto; definir estándares de producto; decidir qué alternativa mantiene la experiencia del destino; liderar una expedición; atención general al viajero; venta y conversión; control financiero global.", "Operativo/ejecutor", "VACANTE / por definir", "Asiento necesario en el modelo objetivo. Actualmente parte de estas responsabilidades las realizan los embajadores; se prevé su centralización para liberar al embajador y al líder de las gestiones que puedan resolverse desde el equipo interno", "", "", "Función principal Operaciones"], ["Operaciones", "Lider de expediciones", "1\tLiderar y acompañar al grupo durante la expedición\n2\tEjecutar el itinerario y las experiencias previstas en destino\n3\tAsegurar la calidad de la experiencia durante la expedición\n4\tGestionar en destino las situaciones e incidencias que requieran actuación presencial\n5\tComunicar incidencias, aprendizajes y necesidades detectadas durante la expedición", "Lidera y ejecuta la expedición en destino, acompañando al grupo y asegurando la calidad de la experiencia durante el viaje.", "¿La expedición se está viviendo y ejecutando en destino con el estándar de Desafío Zero?", "Asegurar la correcta ejecución de la expedición en destino y el acompañamiento del grupo, cuidando la experiencia y gestionando las situaciones que requieran actuación en terreno", "Liderazgo y acompañamiento del grupo; ejecución del itinerario; coordinación de actividades y proveedores en destino; gestión de situaciones e incidencias que requieran presencia física; adaptación del plan ante imprevistos; comunicación con el embajador y equipo interno; cuidado de la dinámica y experiencia del grupo; cumplimiento de protocolos y estándares de seguridad; reporte de incidencias y aprendizajes al finalizar la expedición", "Diseñar o modificar estructuralmente el producto/destino; responsabilidad sobre el destino a largo plazo; gestión general de proveedores y reservas; selección, formación o evaluación de la red de líderes; venta y relación comercial; gestión financiera de la expedición.", "Operativo/ejecutor", "Alberto Almudena Andrea Ania Juan Helena Miguel Lara Pedrito Pol Sara Saru Simona Tali Tina", "El líder es responsable de la experiencia y ejecución en terreno. Las gestiones que puedan resolverse remotamente se escalan a Producto y Destinos / Logística, Reservas y Proveedores para permitir que el líder se mantenga centrado en el grupo.", "", "", "Gestión y Desarrollo de Líderes"], ["Operaciones", "Gestión y Desarrollo de Líderes", "1        Seleccionar e incorporar Líderes de Expedición\n2        Formar, desarrollar y acompañar a los líderes en su evolución.\n3        Asegurar la disponibilidad y cobertura de líderes para las expediciones.\n4        Definir y asegurar estándares comunes de liderazgo, experiencia, seguridad y cultura.\n5        Gestionar la relación con la red de líderes, evaluar su desempeño y asegurar su continuidad y evolución.", "Gestiona y desarrolla la red de Líderes de Expedición, asegurando que su capacidad, preparación y evolución acompañan las necesidades y el crecimiento de Desafío Zero.", "¿Tenemos una red de líderes preparada y suficiente para cubrir las expediciones actuales y futuras?", "Asegurar que Desafío Zero dispone de una red de Líderes de Expedición preparada y con capacidad suficiente para cubrir las necesidades actuales y futuras de la operación y acompañar su crecimiento.", "Selección e incorporación de Líderes de Expedición; formación y desarrollo de capacidades, Forma al líder en cómo ser Líder de Desafío Zero.; asignación de líderes según capacidad, experiencia, disponibilidad y necesidades del calendario; definición y mantenimiento de estándares comunes de liderazgo, experiencia, seguridad y cultura Desafío Zero; coordinación de la formación general y de la habilitación específica por destino junto con Producto y Destinos; seguimiento del desempeño y evaluación post-expedición, incluyendo la recogida de aprendizajes y necesidades de desarrollo; gestión de la capacidad y cobertura de la red de líderes, desarrollando progresivamente su polivalencia entre destinos; soporte y escalado al líder durante la expedición cuando la situación lo requiera.", "Liderar una expedición concreta; ejecutar el itinerario; diseñar productos o destinos; responsabilidad sobre un destino concreto; gestión operativa de proveedores y reservas; atención general al viajero; venta y conversión.", "Estrategico/analítico", "Oliver", "Responsabilidad sobre la red de líderes, diferenciada de la ejecución de cada expedición. Gestiona la capacidad, desarrollo y cobertura de la red; el Líder de Expedición es responsable de la ejecución y experiencia en destino.", "", "", "Función principal Operaciones"], ["Marketing y ventas", "Lider Marketing y Ventas", "1. Definir y ejecutar la estrategia de Marketing y Ventas.\n2. Definir cómo queremos que Desafío Zero sea percibido y a quién queremos llegar.\n3. Asegurar que la marca y lo que ofrecemos se comunican de forma coherente en todos los canales.\n4. Conseguir un flujo suficiente y sostenible de personas interesadas y ventas.\n5. Medir los resultados de Marketing y Ventas y mejorar lo que no funciona.", "Asegurar el correcto funcionamiento global de Marketing y Ventas, alineando estrategia, generación de demanda, comunicación y ventas con los objetivos de crecimiento de Desafío Zero y garantizando que los procesos están definidos, documentados, comunicados y correctamente implantados en el equipo.", "¿Marketing y Ventas están generando suficiente demanda y convirtiéndola en ventas de forma eficaz y alineada con los objetivos de la empresa?", "Asegurar el correcto funcionamiento global de Marketing y Ventas, equilibrando posicionamiento, generación de demanda, conversión y crecimiento rentable.", "Supervisión de los asientos de Marketing y Ventas; definición y seguimiento de la estrategia comercial y de marketing; objetivos de captación, conversión y ventas; presupuesto y asignación de recursos; seguimiento de resultados y principales KPIs; análisis del funnel completo; coordinación entre Marketing y Ventas; identificación y resolución de problemas de capacidad, rendimiento o conversión; alineación con la estrategia global de la empresa; definición y supervisión de procesos de Marketing y Ventas, asegurando que están documentados, actualizados, accesibles y correctamente implantados.", "Ejecución diaria de campañas y canales de adquisición; creación y gestión diaria de contenidos y comunicaciones; gestión individual de leads y oportunidades; atención comercial y cierre de ventas; diseño de producto/destinos; ejecución operativa de expediciones; contabilidad y control financiero.", "Estrategico/analítico", "Rubén", "La Dirección de Marketing y Ventas integra las diferentes funciones del sistema comercial y es accountable del resultado global, pero no necesariamente ejecuta las actividades de cada área. Pricing requiere coordinación con Finanzas para asegurar márgenes y con Operaciones para considerar costes y capacidad.", "", "", "Integrador"], ["Marketing y ventas", "Adquisición de pago", "1. Definir y ejecutar la estrategia de captación de pago por canal y destino\n2. Gestionar y optimizar el presupuesto de inversión publicitaria asignado\n3. Generar leads cualificados hacia el proceso comercial con un coste sostenible\n4. Desarrollar, testar y optimizar campañas, audiencias y landing pages de captación\n5. Medir y reportar el rendimiento y el coste de adquisición por canal y destino", "Atrae potenciales viajeros a través de canales de pago y convierte la inversión publicitaria en leads cualificados para el proceso comercial.", "¿Cuántos leads cualificados traemos con inversión y a qué coste?", "Asegurar un flujo suficiente de leads cualificados procedentes de canales de pago, con un coste de adquisición compatible con el margen de las expediciones.", "Publicidad de pago (Meta Ads, Google Ads y otros canales de pago)\nGestión del presupuesto publicitario asignado\nAudiencias y segmentación de campañas\nCampañas por destino\nBriefing y validación de las creatividades y el copy de los anuncios\nLanding pages de captación\nTracking y atribución de campañas\nColaboraciones o patrocinios pagados orientados a captación\nReporting de coste por lead y CAC por canal y destino", "Contenido y redes orgánicas → Adquisición orgánica\nComunicación con contactos ya captados, email y automatizaciones → Relación y fidelización\nContacto uno a uno, cualificación y cierre → Ventas\nPosicionamiento, propuesta de valor y mensajes de marca → Función principal Marketing y Ventas\nPricing\nDecisión del presupuesto total de marketing: lo decide la Dirección de Marketing y Ventas; este asiento lo propone y lo ejecuta", "", "Juan Hidalgo", "Su número termina en el lead cualificado; la conversión en reserva corresponde a Ventas. Necesita una definición de «lead cualificado» compartida con Ventas. El CAC por destino alimenta el análisis de margen por expedición.", "", "", "Lider Marketing y Ventas"], ["Marketing y ventas", "Adquisición orgánica", "1. Generar demanda a través de redes sociales y contenido sin inversión publicitaria\n2. Planificar y publicar contenido de captación alineado con el calendario de expediciones\n3. Convertir la audiencia orgánica en leads mediante llamadas a la acción, enlaces, formularios y mensajes directos\n4. Gestionar la interacción en redes y derivar a los interesados a Ventas\n5. Medir el rendimiento orgánico por canal y destino y optimizarlo", "Atrae potenciales viajeros mediante redes sociales, contenido y otros canales orgánicos, y convierte esa audiencia en leads para el proceso comercial.", "", "", "Redes sociales\nPlanificación y calendario de contenido\nContenido de expediciones y destinos, incluido el material de líderes y viajeros\nRespuesta a comentarios y mensajes en redes, y derivación de interesados a Ventas\nColaboraciones orgánicas con creadores o intercambios orientadas a captación\nMedición del rendimiento orgánico", "Publicidad de pago, incluida la promoción pagada de publicaciones → Adquisición de pago\nEmail, newsletters y automatizaciones → Relación y fidelización\nCualificación y cierre → Ventas\nPosicionamiento, mensajes clave e identidad de marca → Función principal Marketing y Ventas\nProducto de comunidad → su owner de producto", "", "Elena ", "", "", "", "Lider Marketing y Ventas"], ["Marketing y ventas", "Copywriting", "1. Definir y asegurar la coherencia de la comunicación de Desafío Zero en todos los canales.\n2. Revisar y asegurar la calidad de los mensajes y copies utilizados en las comunicaciones de Desafío Zero.\n3. Asegurar una comunicación adecuada con clientes, contactos y comunidad a lo largo de su relación con Desafío Zero.\n4. Impulsar la fidelización y reactivación de clientes y contactos.\n5. Utilizar el aprendizaje de clientes y contactos para mejorar la comunicación comercial.", "Define y asegura la correcta ejecución de la comunicación de Desafío Zero, manteniendo coherencia entre canales y acompañando la relación con clientes, contactos y comunidad.", "¿Todo lo que comunicamos suena a Desafío Zero y estamos cuidando la relación con las personas que ya nos conocen?", "Asegurar que la comunicación de Desafío Zero es coherente, clara y adecuada en todos los canales y a lo largo de la relación con clientes, contactos y comunidad.", "Definición y aplicación de criterios de comunicación; revisión de copies; revisión de anuncios y contenidos; email marketing; newsletters; comunicaciones a clientes y contactos; segmentación; automatizaciones de comunicación; fidelización; reactivación; revisión de comunicación en redes y publicidad cuando corresponda; coherencia de tono y mensajes entre canales; gestión de reseñas y reputación pública, coordinando con Operaciones cuando se necesita contexto.", "Generación de demanda; gestión de campañas como canal de adquisición; gestión individual de oportunidades comerciales; cierre de ventas; diseño de producto; atención individual de incidencias del viajero.", "Estrategico/analítico", "Karu", "", "Tasa de reactivación de contactos", "Mide la capacidad de volver a activar personas que ya habían tenido una interacción previa con Desafío Zero.", "Función principal Marketing y Ventas"], ["Marketing y ventas", "Ventas y Conversión", "1        Gestionar y cualificar los leads y oportunidades comerciales\n2        Gestionar el proceso comercial desde la oportunidad hasta la reserva\n3        Acompañar al potencial viajero, resolviendo dudas y objeciones y realizando el seguimiento necesario\n4        Asegurar que cada oportunidad comercial recibe el seguimiento necesario hasta su conversión o cierre.\n5        Medir y mejorar la conversión y previsión del sistema comercial", "Gestiona el proceso comercial desde que existe una oportunidad hasta su conversión en reserva, asegurando un proceso de venta ordenado y eficaz.", "¿Estamos convirtiendo las oportunidades que generamos en viajeros?", "Asegurar que las oportunidades comerciales se gestionan y convierten en reservas de forma eficaz y trazable.", "Gestión de leads y oportunidades; proceso comercial; contacto y seguimiento; cualificación; resolución de dudas y objeciones; llamadas comerciales; cierre; seguimiento de oportunidades; gestión y mantenimiento del CRM y pipeline comercial; consolidación y seguimiento del embudo fuente → venta; previsión de ventas; coordinación con Marketing; gestión del equipo de ventas cuando exista.", "Generación de demanda; estrategia de posicionamiento y marca; comunicación general con la base de contactos; diseño de productos y destinos; definición de estándares de producto; ejecución de expediciones; gestión operativa de reservas y proveedores; contabilidad y cobros.", "Operativo/ejecutor", "Sara", "La gestión de la comunicación, segmentación y automatizaciones con la base de contactos pertenece a Comunicación Comercial.", "", "", "Función principal Marketing y Ventas"], ["Marketing y ventas", "Closer de Ventas", "", "", "", "", "", "", "", "Domin, Elena, Miguel", "", "", "", "Ventas y Conversión"], ["Marketing y ventas", "Técnico y diseño web", "1. Definir los precios de las expediciones.\n2. Analizar el mercado y los precios de otras opciones similares.\n3. Asegurar que los precios tienen en cuenta los costes, la demanda, la ocupación y los objetivos de rentabilidad.\n4. Definir promociones y descuentos.\n5. Revisar los precios cuando cambien los costes, la demanda o las condiciones del mercado.", "Define y revisa los precios de las expediciones para asegurar que son competitivos, sostenibles y coherentes con los objetivos de rentabilidad.", "¿Estamos poniendo precios que el mercado acepta y que permiten obtener la rentabilidad que necesitamos?", "Asegurar que los precios de las expediciones son competitivos, rentables y se adaptan a los costes, la demanda y las condiciones del mercado.", "Precios; análisis de mercado; costes; demanda; ocupación; promociones; descuentos; revisión de precios; coordinación con Finanzas y Operaciones.", "Ejecución de cambios de precios en la web; diseño del producto; control financiero global.", "Estrategico/analítico", "Pedro", "Define la política de precios y las decisiones de pricing. La ejecución de los cambios de precio publicados pertenece a Ventas y Conversión.", "", "", "Función principal Marketing y Ventas"], ["Sistemas y Automatización de negocio", "Sistemas y Automatización de negocio", "1.Identificar y priorizar oportunidades de mejora y automatización de procesos.\n2.Diseñar y estandarizar workflows y procesos de negocio para hacerlos más eficientes y escalables.\n3.Implementar y mantener automatizaciones, integraciones y sistemas que soporten los procesos clave de la empresa.\n4.Asegurar la correcta configuración, gestión y disponibilidad de las herramientas y sistemas de trabajo de DZ.\n5.Reducir el trabajo manual, los errores y las ineficiencias, midiendo el impacto de las mejoras y automatizaciones implantadas.", "Asegura que los procesos, sistemas, herramientas, integraciones y automatizaciones necesarias para trabajar en Desafío Zero están correctamente diseñados, configurados y funcionando de forma eficiente.", "¿Tenemos procesos y sistemas que nos permiten trabajar de forma eficiente, escalable y con el mínimo trabajo manual posible?", "Asegurar que los procesos y sistemas de Desafío Zero están correctamente diseñados, conectados, automatizados y funcionando de forma eficiente.", "Workflows; automatizaciones; integraciones; Airtable; Google Workspace; configuración de usuarios y permisos; licencias; herramientas SaaS; sistemas internos; incidencias IT; proveedores tecnológicos; identificación de oportunidades de automatización; medición del impacto.", "Ejecución de los procesos de negocio; ownership de los resultados de Marketing, Ventas, Finanzas u Operaciones; desarrollo de producto; soporte técnico especializado que deba ser externalizado.", "Especialista/Técnico", "", "El foco principal es la mejora de procesos y la automatización. IT y administración de herramientas forman parte del seat como soporte al funcionamiento del negocio.", "", "", "Integrador"]]}, "guideSheet": {"name": "Descripción", "rows": [["GUÍA · ACCOUNTABILITY CHART"], ["¿Para qué sirve? El Accountability Chart define qué responsabilidades necesita tener cubiertas la empresa y quién es responsable de cada una. No es un organigrama de personas ni una lista de tareas."], ["1. QUÉ ES Y PARA QUÉ LO HACEMOS"], ["Qué queremos definir", "Las responsabilidades que DZ necesita tener cubiertas para funcionar bien durante los próximos 6–12 meses."], ["Por qué", "Para que quede claro quién responde de cada cosa, evitar duplicidades y detectar responsabilidades que hoy no tienen dueño."], ["Qué NO es", "No es un listado de todo lo que hace cada persona, ni un organigrama definitivo, ni una lista de tareas del día a día."], ["Primera iteración", "Primero definimos los asientos y sus responsabilidades. Después, con el equipo directivo, asignamos las personas que ocuparán cada asiento."], ["2. CONCEPTOS CLAVE"], ["Concepto", "Qué significa", "Ejemplo en DZ"], ["Big Function / Función principal", "Una gran área de responsabilidad de la empresa. Agrupa varios asientos relacionados.", "Operaciones · Marketing y Ventas · Administración y Finanzas"], ["Asiento (Seat)", "Una responsabilidad que la empresa necesita que alguien tenga bajo control. Es la 'cajita' del Accountability Chart.", "Generación de Demanda"], ["Owner / Responsable", "La persona que responde de que ese asiento funcione y se cumplan sus responsabilidades. Su nombre significa: «si esto falla, me aseguro de que se solucione».", "Generación de Demanda → María"], ["Responsabilidad", "Lo que esa persona debe conseguir o asegurar dentro del asiento. Son responsabilidades grandes, no tareas.", "Generar demanda suficiente y cualificada"], ["Tarea", "Una acción concreta que se hace para cumplir una responsabilidad. Las tareas no son asientos.", "Crear una campaña de Meta"], ["Persona", "Quién ocupa un asiento. Una persona puede ocupar más de un asiento si la empresa lo necesita.", "Oliver → Dirección de Operaciones + Producto y Destinos"], ["Importante: una persona puede ocupar varios asientos, un asiento puede estar vacío y varias personas pueden ejecutar tareas dentro de un mismo asiento. Lo importante es que haya una única <script>
(() => {
'use strict';
/* ============================================================
   Utilidades
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const norm = s => fold(s).replace(/[¿?¡!]/g, '').replace(/\s+/g, ' ').trim();
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const KEY_ASSIGN = 'acdz.assignments.v1';
const KEY_RAW = 'acdz.loadedExcel.v2';
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}

/* ============================================================
   Configuración de lectura (independiente del contenido)
   ============================================================ */
const HEADER_ALIASES = {
  area:['funcion principal','area','big function'],
  seat:['asiento','seat'],
  resp:['5 roles del asiento','roles del asiento','5 roles','roles','5 funciones principales','5 responsabilidades','responsabilidades','funciones principales'],
  description:['descripcion'],
  question:['pregunta','pregunta de accountability'],
  accountability:['accountability'],
  includes:['que incluye'],
  excludes:['que no incluye'],
  type:['tipo'],
  person:['responsable','persona','owner'],
  comments:['comentarios'],
  metric:['metrica propuesta','metrica'],
  measures:['que mide'],
  parent:['reporta a']
};
const DETAIL_FIELDS = [
  ['accountability','Accountability'],['description','Descripción'],['question','Pregunta de accountability'],
  ['includes','Qué incluye'],['excludes','Qué NO incluye'],['type','Tipo'],['comments','Comentarios'],
  ['metric','Métrica propuesta'],['measures','Qué mide']
];
const PENDING_RX = /por clasificar|por asignar|pendiente|\btbd\b|sin definir/i;
const VACANT_RX  = /vacante|por definir|\btbd\b|pendiente|sin asignar/i;
const MULTI_RX   = /\s(y|e)\s|,|\+|&|\/|;/i;
function splitPeople(v){
  const base = String(v).replace(/\(.*?\)/g,'').trim();
  let parts = base.split(/\s*(?:,|;|\/|\+|&|\s(?:y|e)\s)\s*/).map(x => x.trim()).filter(Boolean);
  if (parts.length < 2) parts = base.split(/\s+/).filter(Boolean);
  return parts;
}
const LEAD_RX    = /^(visionari|visionary|integrad|integrator)/i;
const HEAD_RX    = /^funci[oó]n principal/i;
/* Observaciones detectadas al revisar este Excel. Solo se muestran si la condición sigue dándose en los datos. */
const MANUAL_NOTES = [
  { seat:'contabilidad & administracion',
    when: s => /n[oó]mina/i.test(s.includes) && /gesti[oó]n laboral/i.test(s.excludes),
    text:'«Qué incluye» enumera contenidos de gestión laboral (altas y bajas, contratos laborales, nóminas, vacaciones, asesoría laboral…), mientras que su propio «Qué NO incluye» remite «Gestión laboral → Gestión Laboral». Posible texto copiado de otro asiento: revisar.' }
];
const AREA_COLORS = ['--a1','--a2','--a3','--a4','--a6'];

/* ============================================================
   Modelo: se construye SIEMPRE a partir de las filas del Excel
   ============================================================ */
function parseResp(raw){
  const lines = String(raw ?? '').split(/\r?\n/).filter(l => l.trim() !== '');
  return lines.map(l => {
    const m = l.match(/^\s*(\d{1,2})\s*[.)]?\s+(\S[\s\S]*)$/);
    return m ? { num:+m[1], text:m[2].trim() } : { num:null, text:l.trim() };
  });
}

function buildModel(raw){
  const rows = (raw && raw.seatsSheet && raw.seatsSheet.rows) || [];
  const hdr = rows[0] || [];
  const idx = {};
  hdr.forEach((h,i) => { const n = norm(h); for (const [k,al] of Object.entries(HEADER_ALIASES)) if (idx[k] == null && al.includes(n)) idx[k] = i; });
  const missingCols = ['seat','resp','person','parent','area'].filter(k => idx[k] == null);
  const respCol = idx.resp != null ? String(hdr[idx.resp]).trim() : '5 roles del asiento';

  const seats = [];
  rows.slice(1).forEach((r,i) => {
    if (!r || !r.some(v => String(v ?? '').trim() !== '')) return;
    const g = k => idx[k] == null ? '' : String(r[idx[k]] ?? '');
    const s = { row:i+2, area:g('area').trim(), seat:g('seat').trim(), respRaw:g('resp'),
                excelPerson:g('person').trim(), parentRaw:g('parent').trim(), issues:[] };
    DETAIL_FIELDS.forEach(([k]) => s[k] = g(k).trim());
    seats.push(s);
  });

  const used = {};
  seats.forEach(s => {
    const b = norm(s.seat || ('fila ' + s.row)).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'seat';
    let id = b, n = 2; while (used[id]) id = b + '-' + (n++); used[id] = 1; s.id = id;
    s.isLead = LEAD_RX.test(s.seat); s.isHead = HEAD_RX.test(s.seat);
  });
  const byId = Object.fromEntries(seats.map(s => [s.id, s]));

  // 1. nombre
  seats.forEach(s => { if (!s.seat) s.issues.push({level:'warn',kind:'seat',text:`⚠ Revisar: el asiento de la fila ${s.row} no tiene nombre en el Excel.`}); });
  // 7. duplicados
  const byName = {};
  seats.forEach(s => { if (s.seat) (byName[norm(s.seat)] ??= []).push(s); });
  Object.values(byName).forEach(l => { if (l.length > 1) l.forEach(s => s.issues.push({level:'warn',kind:'dup',text:`⚠ Revisar: asiento duplicado (aparece en las filas ${l.map(x=>x.row).join(', ')}).`})); });
  // 25. por clasificar
  seats.forEach(s => {
    s.pending = PENDING_RX.test(s.area) || PENDING_RX.test(s.seat);
    if (s.pending) s.issues.push({level:'pending',kind:'pending',text:`⚠ Pendiente de clasificación: el Excel lo ubica en «${s.area || '—'}».`});
  });
  // 3. cinco responsabilidades
  seats.forEach(s => {
    const items = parseResp(s.respRaw); s.resp = items; s.respOk = items.length === 5;
    if (!s.respOk) {
      const what = items.length === 0 ? 'está vacía' : items.length === 1 ? 'contiene un único texto' : `contiene ${items.length} líneas`;
      s.issues.push({level:'warn',kind:'resp',text:`⚠ Revisar roles: se esperan 5 y la columna «${respCol}» ${what}.`});
    } else {
      const miss = items.map((x,i) => x.num == null ? i+1 : null).filter(Boolean);
      if (miss.length) s.issues.push({level:'info',kind:'resp',text:`El rol ${miss.join(', ')} no lleva número en el Excel; se muestra en su posición.`});
      if (!items.every((x,i) => x.num == null || x.num === i+1)) s.issues.push({level:'warn',kind:'resp',text:'⚠ Revisar roles: la numeración del Excel no es correlativa.'});
    }
  });
  // responsabilidades repetidas entre asientos
  const rmap = {};
  seats.forEach(s => s.respOk && s.resp.forEach((x,i) => (rmap[norm(x.text)] ??= []).push([s,i])));
  Object.values(rmap).forEach(l => { if (l.length > 1) l.forEach(([s,i]) => s.issues.push({level:'warn',kind:'dup',text:`⚠ Revisar: el rol ${i+1} está repetido en ${l.filter(([o])=>o!==s).map(([o])=>'«'+o.seat+'»').join(', ')}.`})); });
  // 6. relaciones jerárquicas
  const byNorm = {}; seats.forEach(s => { if (s.seat && !byNorm[norm(s.seat)]) byNorm[norm(s.seat)] = s; });
  seats.forEach(s => {
    s.parentId = null;
    if (!s.parentRaw) return;
    const n = norm(s.parentRaw), p = byNorm[n];
    if (p && p !== s) { s.parentId = p.id; return; }
    let best = null, bd = 99;
    seats.forEach(o => { if (o === s || !o.seat) return; const d = lev(n, norm(o.seat)); if (d < bd) { bd = d; best = o; } });
    if (best && bd <= 2) {
      s.parentId = best.id;
      s.issues.push({level:'warn',kind:'parent',text:`⚠ Revisar relación: «Reporta a» dice «${s.parentRaw}», que no coincide exactamente con ningún asiento. Se muestra vinculado a «${best.seat}» por similitud del nombre; confirmar.`});
    } else {
      const fp = s.parentRaw.match(/^funci[oó]n principal\s+(.+)$/i);
      const lead = fp && seats.find(o => o !== s && norm(o.seat) === 'lider ' + norm(fp[1]));
      if (lead) {
        s.parentId = lead.id;
        s.issues.push({level:'warn',kind:'parent',text:`⚠ Revisar relación: «Reporta a» dice «${s.parentRaw}», asiento que ya no existe en el Excel. Se muestra bajo «${lead.seat}», el líder de esa función principal; conviene actualizar «Reporta a».`});
      } else {
        s.issues.push({level:'warn',kind:'parent',text:`⚠ Revisar relación: «Reporta a» dice «${s.parentRaw}», que no corresponde a ningún asiento. Relación por definir.`});
      }
    }
  });
  seats.forEach(s => {
    const seen = new Set([s.id]); let p = s.parentId;
    while (p) { if (seen.has(p)) { s.issues.push({level:'warn',kind:'parent',text:'⚠ Revisar relación: se ha detectado una relación circular. Relación por definir.'}); s.parentId = null; break; } seen.add(p); p = byId[p] && byId[p].parentId; }
  });
  const children = {};
  seats.forEach(s => { if (s.parentId) (children[s.parentId] ??= []).push(s); });
  const orphans = seats.filter(s => !s.parentId);
  const desc = id => (children[id] || []).reduce((a, k) => a + 1 + desc(k.id), 0);
  let roots = orphans.filter(s => !s.pending);
  if (roots.length > 1) {
    const leads = roots.filter(s => s.isLead);
    const keep = leads.length ? leads : [roots.slice().sort((a, b) => desc(b.id) - desc(a.id))[0]];
    roots = roots.filter(s => keep.includes(s));
  }
  const pendingZone = orphans.filter(s => s.pending);
  const undefinedZone = orphans.filter(s => !s.pending && !roots.includes(s));
  undefinedZone.forEach(s => {
    if (s.parentRaw) return; // ya avisado arriba
    s.issues.push({level:'warn',kind:'parent',text:'⚠ Relación por definir: el Excel no indica a qué asiento reporta («Reporta a» vacío).'});
  });
  // asiento cabeza de función principal: cuelga de un asiento de liderazgo y tiene asientos debajo
  seats.forEach(s => { s.isHead = HEAD_RX.test(s.seat) || !!(s.parentId && byId[s.parentId].isLead && (children[s.id] || []).length); });
  // área distinta a la del asiento superior
  seats.forEach(s => {
    const p = s.parentId && byId[s.parentId];
    if (p && s.area && p.area && !p.isLead && norm(s.area) !== norm(p.area))
      s.issues.push({level:'warn',kind:'area',text:`⚠ Revisar área: el Excel lo sitúa en «${s.area}», pero reporta a «${p.seat}», que está en «${p.area}».`});
  });
  pendingZone.forEach(s => { if (!s.parentRaw) s.issues.push({level:'info',kind:'parent',text:'Relación por definir: el Excel no indica a qué asiento reporta.'}); });
  // 2 / 11. personas del Excel
  seats.forEach(s => {
    const v = s.excelPerson;
    if (!v) s.excelStatus = 'empty';
    else if (VACANT_RX.test(v)) { s.excelStatus = 'vacant'; s.issues.push({level:'info',kind:'person',text:`El Excel indica «${v}» en Responsable: se muestra como sin asignar.`}); }
    else if (MULTI_RX.test(v.replace(/\(.*?\)/g,'')) || v.replace(/\(.*?\)/g,'').trim().split(/\s+/).length >= 4) {
      s.excelStatus = 'multi'; s.people = splitPeople(v);
      s.issues.push({level:'multi',kind:'person',text:`Este asiento tiene varias personas en «Responsable» (${s.people.length}: ${s.people.join(', ')}). En EOS solo es válido si todas hacen exactamente el mismo trabajo (por ejemplo, varios líderes de expedición); si no, debe haber una única persona accountable.`});
    }
    else { s.excelStatus = 'assigned'; const a = v.match(/\((.*?)\)/); if (a) s.issues.push({level:'info',kind:'person',text:`El Excel acompaña el nombre de la anotación «${a[1]}».`}); }
  });
  // observaciones de revisión
  seats.forEach(s => MANUAL_NOTES.forEach(m => { if (norm(s.seat) === m.seat && m.when(s)) s.issues.push({level:'warn',kind:'note',text:'⚠ Revisar contenido: ' + m.text, src:'Observación detectada al revisar el Excel (no forma parte del Excel).'}); }));
  // referencias de «Qué NO incluye» a asientos inexistentes
  const refs = [];
  seats.forEach(s => String(s.excludes).split(/\n|;/).forEach(line => {
    const i = line.indexOf('→'); if (i < 0) return;
    line.slice(i+1).split(/\s\/\s|\s\+\s/).forEach(t => {
      t = t.replace(/[.\s]+$/,'').trim(); if (!t || /^[a-záéíóúñ]/.test(t)) return;
      const nt = norm(t);
      const ok = seats.some(o => { const on = norm(o.seat); return on && (nt === on || nt.startsWith(on + ',') || nt.startsWith(on + ' ')); });
      if (!ok) refs.push({ from:s, target:t });
    });
  }));
  // áreas
  const areas = []; seats.forEach(s => { if (s.area && !areas.includes(s.area)) areas.push(s.area); });
  const areaColor = {}; let ci = 0;
  areas.forEach(a => { areaColor[a] = PENDING_RX.test(a) ? '--a5' : AREA_COLORS[(ci++) % AREA_COLORS.length]; });
  const vm = String(raw.fileName || '').match(/v\s*(\d+(?:[._]\d+)?)/i);
  return { raw, respCol, seats, byId, children, roots, pendingZone, undefinedZone, refs, areas, areaColor, missingCols, version: vm ? 'V' + vm[1] : null };
}

/* ============================================================
   Estado
   ============================================================ */
const EMBEDDED = JSON.parse(document.getElementById('excel-data').textContent);
let RAW = EMBEDDED, usingLoaded = false;
{ const r = LS.get(KEY_RAW); if (r) { try { RAW = JSON.parse(r); usingLoaded = true; } catch(e){} } }
let M = buildModel(RAW);
const expanded = new Set(), collapsed = new Set();
let overrides = {};           // id de seat -> { person: string|null }  (solo cambios hechos en la interfaz)
let dirty = false;
{ const r = LS.get(KEY_ASSIGN); if (r) { try { overrides = JSON.parse(r).assignments || {}; } catch(e){} } }
const F = { area:'', person:'', unassigned:false, warn:false };
let Q = '', hits = [], hitPos = -1;

const personBase = n => String(n || '').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
const personKey = n => norm(personBase(n));
function eff(s){
  if (Object.prototype.hasOwnProperty.call(overrides, s.id)) {
    const p = overrides[s.id].person;
    return p ? { status:'assigned', name:p, source:'edit' } : { status:'empty', name:null, source:'edit' };
  }
  if (s.excelStatus === 'assigned') return { status:'assigned', name:s.excelPerson, source:'excel' };
  if (s.excelStatus === 'multi') return { status:'multi', name:s.excelPerson, source:'excel' };
  return { status:'empty', name:null, source:'excel', excelLabel: s.excelStatus === 'vacant' ? s.excelPerson : null };
}
function otherSeatsOf(s){
  const p = eff(s); if (p.status !== 'assigned') return [];
