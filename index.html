<script>
(() => {
'use strict';
/* ============================================================
   Utilidades
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const norm = s => fold(s).replace(/[¿?¡!]/g, '').replace(/\s+/g, ' ').trim();
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); return true; } catch(e){ return false; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const KEY_ASSIGN = 'acdz.assignments.v1';
const KEY_RAW = 'acdz.loadedExcel.v1';
function lev(a,b){
  const m=a.length,n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}

/* ============================================================
   Configuración de lectura (independiente del contenido)
   ============================================================ */
const HEADER_ALIASES = {
  area:['funcion principal','area','big function'],
  seat:['asiento','seat'],
  resp:['5 funciones principales','5 responsabilidades','responsabilidades','funciones principales'],
  description:['descripcion'],
  question:['pregunta','pregunta de accountability'],
  accountability:['accountability'],
  includes:['que incluye'],
  excludes:['que no incluye'],
  type:['tipo'],
  person:['responsable','persona','owner'],
  comments:['comentarios'],
  metric:['metrica propuesta','metrica'],
  measures:['que mide'],
  parent:['reporta a']
};
const DETAIL_FIELDS = [
  ['accountability','Accountability'],['description','Descripción'],['question','Pregunta de accountability'],
  ['includes','Qué incluye'],['excludes','Qué NO incluye'],['type','Tipo'],['comments','Comentarios'],
  ['metric','Métrica propuesta'],['measures','Qué mide']
];
const PENDING_RX = /por clasificar|por asignar|pendiente|\btbd\b|sin definir/i;
const VACANT_RX  = /vacante|por definir|\btbd\b|pendiente|sin asignar/i;
const MULTI_RX   = /\s(y|e)\s|,|\+|&|\/|;/i;
const LEAD_RX    = /^(visionari|visionary|integrad|integrator)/i;
const HEAD_RX    = /^funci[oó]n principal/i;
/* Observaciones detectadas al revisar este Excel. Solo se muestran si la condición sigue dándose en los datos. */
const MANUAL_NOTES = [
  { seat:'contabilidad & administracion',
    when: s => /n[oó]mina/i.test(s.includes) && /gesti[oó]n laboral/i.test(s.excludes),
    text:'«Qué incluye» enumera contenidos de gestión laboral (altas y bajas, contratos laborales, nóminas, vacaciones, asesoría laboral…), mientras que su propio «Qué NO incluye» remite «Gestión laboral → Gestión Laboral». Posible texto copiado de otro asiento: revisar.' }
];
const AREA_COLORS = ['--a1','--a2','--a3','--a4','--a6'];

/* ============================================================
   Modelo: se construye SIEMPRE a partir de las filas del Excel
   ============================================================ */
function parseResp(raw){
  const lines = String(raw ?? '').split(/\r?\n/).filter(l => l.trim() !== '');
  return lines.map(l => {
    const m = l.match(/^\s*(\d{1,2})\s*[.)]?\s+(\S[\s\S]*)$/);
    return m ? { num:+m[1], text:m[2].trim() } : { num:null, text:l.trim() };
  });
}

function buildModel(raw){
  const rows = (raw && raw.seatsSheet && raw.seatsSheet.rows) || [];
  const hdr = rows[0] || [];
  const idx = {};
  hdr.forEach((h,i) => { const n = norm(h); for (const [k,al] of Object.entries(HEADER_ALIASES)) if (idx[k] == null && al.includes(n)) idx[k] = i; });
  const missingCols = ['seat','resp','person','parent','area'].filter(k => idx[k] == null);

  const seats = [];
  rows.slice(1).forEach((r,i) => {
    if (!r || !r.some(v => String(v ?? '').trim() !== '')) return;
    const g = k => idx[k] == null ? '' : String(r[idx[k]] ?? '');
    const s = { row:i+2, area:g('area').trim(), seat:g('seat').trim(), respRaw:g('resp'),
                excelPerson:g('person').trim(), parentRaw:g('parent').trim(), issues:[] };
    DETAIL_FIELDS.forEach(([k]) => s[k] = g(k).trim());
    seats.push(s);
  });

  const used = {};
  seats.forEach(s => {
    const b = norm(s.seat || ('fila ' + s.row)).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'seat';
    let id = b, n = 2; while (used[id]) id = b + '-' + (n++); used[id] = 1; s.id = id;
    s.isLead = LEAD_RX.test(s.seat); s.isHead = HEAD_RX.test(s.seat);
  });
  const byId = Object.fromEntries(seats.map(s => [s.id, s]));

  // 1. nombre
  seats.forEach(s => { if (!s.seat) s.issues.push({level:'warn',kind:'seat',text:`⚠ Revisar: el asiento de la fila ${s.row} no tiene nombre en el Excel.`}); });
  // 7. duplicados
  const byName = {};
  seats.forEach(s => { if (s.seat) (byName[norm(s.seat)] ??= []).push(s); });
  Object.values(byName).forEach(l => { if (l.length > 1) l.forEach(s => s.issues.push({level:'warn',kind:'dup',text:`⚠ Revisar: asiento duplicado (aparece en las filas ${l.map(x=>x.row).join(', ')}).`})); });
  // 25. por clasificar
  seats.forEach(s => {
    s.pending = PENDING_RX.test(s.area) || PENDING_RX.test(s.seat);
    if (s.pending) s.issues.push({level:'pending',kind:'pending',text:`⚠ Pendiente de clasificación: el Excel lo ubica en «${s.area || '—'}».`});
  });
  // 3. cinco responsabilidades
  seats.forEach(s => {
    const items = parseResp(s.respRaw); s.resp = items; s.respOk = items.length === 5;
    if (!s.respOk) {
      const what = items.length === 0 ? 'está vacía' : items.length === 1 ? 'contiene un único texto' : `contiene ${items.length} líneas`;
      s.issues.push({level:'warn',kind:'resp',text:`⚠ Revisar responsabilidades: se esperan 5 y la columna «5 funciones principales» ${what}.`});
    } else {
      const miss = items.map((x,i) => x.num == null ? i+1 : null).filter(Boolean);
      if (miss.length) s.issues.push({level:'info',kind:'resp',text:`La responsabilidad ${miss.join(', ')} no lleva número en el Excel; se muestra en su posición.`});
      if (!items.every((x,i) => x.num == null || x.num === i+1)) s.issues.push({level:'warn',kind:'resp',text:'⚠ Revisar responsabilidades: la numeración del Excel no es correlativa.'});
    }
  });
  // responsabilidades repetidas entre asientos
  const rmap = {};
  seats.forEach(s => s.respOk && s.resp.forEach((x,i) => (rmap[norm(x.text)] ??= []).push([s,i])));
  Object.values(rmap).forEach(l => { if (l.length > 1) l.forEach(([s,i]) => s.issues.push({level:'warn',kind:'dup',text:`⚠ Revisar: la responsabilidad ${i+1} está repetida en ${l.filter(([o])=>o!==s).map(([o])=>'«'+o.seat+'»').join(', ')}.`})); });
  // 6. relaciones jerárquicas
  const byNorm = {}; seats.forEach(s => { if (s.seat && !byNorm[norm(s.seat)]) byNorm[norm(s.seat)] = s; });
  seats.forEach(s => {
    s.parentId = null;
    if (!s.parentRaw) return;
    const n = norm(s.parentRaw), p = byNorm[n];
    if (p && p !== s) { s.parentId = p.id; return; }
    let best = null, bd = 99;
    seats.forEach(o => { if (o === s || !o.seat) return; const d = lev(n, norm(o.seat)); if (d < bd) { bd = d; best = o; } });
    if (best && bd <= 2) {
      s.parentId = best.id;
      s.issues.push({level:'warn',kind:'parent',text:`⚠ Revisar relación: «Reporta a» dice «${s.parentRaw}», que no coincide exactamente con ningún asiento. Se muestra vinculado a «${best.seat}» por similitud del nombre; confirmar.`});
    } else {
      s.issues.push({level:'warn',kind:'parent',text:`⚠ Revisar relación: «Reporta a» dice «${s.parentRaw}», que no corresponde a ningún asiento. Relación por definir.`});
    }
  });
  seats.forEach(s => {
    const seen = new Set([s.id]); let p = s.parentId;
    while (p) { if (seen.has(p)) { s.issues.push({level:'warn',kind:'parent',text:'⚠ Revisar relación: se ha detectado una relación circular. Relación por definir.'}); s.parentId = null; break; } seen.add(p); p = byId[p] && byId[p].parentId; }
  });
  const children = {};
  seats.forEach(s => { if (s.parentId) (children[s.parentId] ??= []).push(s); });
  const orphans = seats.filter(s => !s.parentId);
  const roots = orphans.filter(s => !s.pending);
  const pendingZone = orphans.filter(s => s.pending);
  roots.forEach(s => {
    if (s.parentRaw) return; // ya avisado arriba
    if (!(s.isLead || roots.length === 1)) s.issues.push({level:'warn',kind:'parent',text:'Relación por definir: el Excel no indica a qué asiento reporta.'});
  });
  pendingZone.forEach(s => { if (!s.parentRaw) s.issues.push({level:'info',kind:'parent',text:'Relación por definir: el Excel no indica a qué asiento reporta.'}); });
  // 2 / 11. personas del Excel
  seats.forEach(s => {
    const v = s.excelPerson;
    if (!v) s.excelStatus = 'empty';
    else if (VACANT_RX.test(v)) { s.excelStatus = 'vacant'; s.issues.push({level:'info',kind:'person',text:`El Excel indica «${v}» en Responsable: se muestra como sin asignar.`}); }
    else if (MULTI_RX.test(v.replace(/\(.*?\)/g,''))) { s.excelStatus = 'multi'; s.issues.push({level:'warn',kind:'person',text:`⚠ Revisar asignación: «${v}» parece contener más de una persona. Cada seat debe tener un único accountable.`}); }
    else { s.excelStatus = 'assigned'; const a = v.match(/\((.*?)\)/); if (a) s.issues.push({level:'info',kind:'person',text:`El Excel acompaña el nombre de la anotación «${a[1]}».`}); }
  });
  // observaciones de revisión
  seats.forEach(s => MANUAL_NOTES.forEach(m => { if (norm(s.seat) === m.seat && m.when(s)) s.issues.push({level:'warn',kind:'note',text:'⚠ Revisar contenido: ' + m.text, src:'Observación detectada al revisar el Excel (no forma parte del Excel).'}); }));
  // referencias de «Qué NO incluye» a asientos inexistentes
  const refs = [];
  seats.forEach(s => String(s.excludes).split(/\n|;/).forEach(line => {
    const i = line.indexOf('→'); if (i < 0) return;
    line.slice(i+1).split(/\s\/\s|\s\+\s/).forEach(t => {
      t = t.replace(/[.\s]+$/,'').trim(); if (!t || /^[a-záéíóúñ]/.test(t)) return;
      const nt = norm(t);
      const ok = seats.some(o => { const on = norm(o.seat); return on && (nt === on || nt.startsWith(on + ',') || nt.startsWith(on + ' ')); });
      if (!ok) refs.push({ from:s, target:t });
    });
  }));
  // áreas
  const areas = []; seats.forEach(s => { if (s.area && !areas.includes(s.area)) areas.push(s.area); });
  const areaColor = {}; let ci = 0;
  areas.forEach(a => { areaColor[a] = PENDING_RX.test(a) ? '--a5' : AREA_COLORS[(ci++) % AREA_COLORS.length]; });
  const vm = String(raw.fileName || '').match(/v\s*(\d+(?:[._]\d+)?)/i);
  return { raw, seats, byId, children, roots, pendingZone, refs, areas, areaColor, missingCols, version: vm ? 'V' + vm[1] : null };
}

/* ============================================================
   Estado
   ============================================================ */
const EMBEDDED = JSON.parse(document.getElementById('excel-data').textContent);
let RAW = EMBEDDED, usingLoaded = false;
{ const r = LS.get(KEY_RAW); if (r) { try { RAW = JSON.parse(r); usingLoaded = true; } catch(e){} } }
let M = buildModel(RAW);
const expanded = new Set(), collapsed = new Set();
let overrides = {};           // id de seat -> { person: string|null }  (solo cambios hechos en la interfaz)
let dirty = false;
{ const r = LS.get(KEY_ASSIGN); if (r) { try { overrides = JSON.parse(r).assignments || {}; } catch(e){} } }
const F = { area:'', person:'', unassigned:false, warn:false };
let Q = '', hits = [], hitPos = -1;

const personBase = n => String(n || '').replace(/\(.*?\)/g,'').replace(/\s+/g,' ').trim();
const personKey = n => norm(personBase(n));
function eff(s){
  if (Object.prototype.hasOwnProperty.call(overrides, s.id)) {
    const p = overrides[s.id].person;
    return p ? { status:'assigned', name:p, source:'edit' } : { status:'empty', name:null, source:'edit' };
  }
  if (s.excelStatus === 'assigned') return { status:'assigned', name:s.excelPerson, source:'excel' };
  if (s.excelStatus === 'multi') return { status:'multi', name:s.excelPerson, source:'excel' };
  return { status:'empty', name:null, source:'excel', excelLabel: s.excelStatus === 'vacant' ? s.excelPerson : null };
}
function otherSeatsOf(s){
  const p = eff(s); if (p.status !== 'assigned') return [];
  const k = personKey(p.name);
  return M.seats.filter(o => o !== s && eff(o).status === 'assigned' && personKey(eff(o).name) === k);
}
function issuesOf(s){
  const out = s.issues.slice();
  const others = otherSeatsOf(s);
  if (others.length) out.push({level:'multi',kind:'multi',text:`Esta persona ocupa también: ${others.map(o=>'«'+o.seat+'»').join(', ')}. Una persona puede ocupar varios seats; cada seat mantiene su propia accountability.`});
  if (s.excelStatus === 'multi' && Object.prototype.hasOwnProperty.call(overrides, s.id)) {
    const i = out.findIndex(x => x.kind === 'person' && x.level === 'warn'); if (i >= 0) out[i] = {...out[i], level:'info', text: out[i].text + ' (Asignación modificada desde la interfaz.)'};
  }
  return out;
}
const hasWarn = s => issuesOf(s).some(i => i.level === 'warn' || i.level === 'pending');
const areaKey = s => s.area || '(sin)';
function passes(s){
  if (F.area && areaKey(s) !== F.area) return false;
  if (F.person) { const p = eff(s); if (p.status !== 'assigned' || personKey(p.name) !== F.person) return false; }
  if (F.unassigned && eff(s).status !== 'empty') return false;
  if (F.warn && !hasWarn(s)) return false;
  return true;
}
const filtersActive = () => !!(F.area || F.person || F.unassigned || F.warn);

/* ============================================================
   Búsqueda (insensible a tildes y mayúsculas)
   ============================================================ */
function hl(text){
  text = String(text ?? '');
  const q = fold(Q).trim(); if (q.length < 2) return esc(text);
  const chars = Array.from(text); let f = '', map = [];
  chars.forEach((c,i) => { const fc = fold(c); for (const x of fc) { f += x; map.push(i); } });
  let out = '', last = 0, from = 0, pos;
  while ((pos = f.indexOf(q, from)) >= 0) {
    const a = map[pos], b = map[pos + q.length - 1] + 1;
    if (a < last) { from = pos + 1; continue; }
    out += esc(chars.slice(last, a).join('')) + '<mark>' + esc(chars.slice(a, b).join('')) + '</mark>';
    last = b; from = pos + q.length;
  }
  return out + esc(chars.slice(last).join(''));
}
function computeHits(){
  hits = []; const q = fold(Q).trim();
  if (q.length < 2) { hitPos = -1; return; }
  const has = t => fold(t).includes(q);
  M.seats.forEach(s => {
    const p = eff(s);
    const rIdx = s.resp.map((x,i) => has(x.text) ? i : -1).filter(i => i >= 0);
    const inRaw = !s.respOk && has(s.respRaw);
    if (has(s.seat) || has(s.area) || (p.name && has(p.name)) || rIdx.length || inRaw) {
      hits.push({ id:s.id, resp:rIdx });
      if (rIdx.length || inRaw) expanded.add(s.id);
      let par = s.parentId; while (par) { collapsed.delete(par); par = M.byId[par].parentId; }
    }
  });
  hitPos = hits.length ? 0 : -1;
}

const stage = $('#stage'), viewport = $('#viewport');

function cardHTML(s){

  const open = expanded.has(s.id);
  const kids = M.children[s.id] || [];
  const hit = hits.find(h => h.id === s.id);
  const cur = hit && hits[hitPos] === hit;
  const dim = (filtersActive() && !passes(s)) || (hits.length && !hit) || (fold(Q).trim().length >= 2 && !hits.length);
  const color = s.area ? `var(${M.areaColor[s.area]})` : 'var(--lead-bg)';

  }
  return `<article class="${cls}" data-id="${s.id}" style="--ac:${color}">
    <div class="card-top">

      ${nWarn ? `<button class="chip warn" data-act="detail" title="Ver avisos">⚠ Revisar${nWarn>1?' ('+nWarn+')':''}</button>` : ''}
    </div>
    <h3 class="seat">${hl(s.seat || '(sin nombre)')}</h3>
    ${personHTML(s, `<button class="toggle" data-act="toggle" aria-expanded="${open}" aria-controls="r-${s.id}" title="${open ? 'Ocultar' : 'Mostrar'} ${s.respOk ? 'las 5 responsabilidades' : 'el contenido'}" aria-label="${open ? 'Ocultar' : 'Mostrar'} responsabilidades">${open ? '▼' : '▶'}</button>`)}
    ${kids.length ? `<div class="card-foot"><button class="kids-toggle" data-act="kids" aria-expanded="${!collapsed.has(s.id)}" title="${collapsed.has(s.id)?'Mostrar':'Ocultar'} los asientos que dependen de este">${collapsed.has(s.id)?'▸':'▾'} ${kids.length} asiento${kids.length>1?'s':''} dependiente${kids.length>1?'s':''}</button></div>` : ''}
    ${respHTML}
  </article>`;
}
function nodeHTML(s, depth, layout){
  const kids = M.children[s.id] || [];
  const childLayout = depth <= 1 ? 'h' : 'v';
  const isCol = layout === 'h' && childLayout === 'v';
  let h = `<div class="node ${layout === 'h' ? 'hnode' : 'vnode'}${isCol ? ' col' : ''}">` + cardHTML(s);
  if (kids.length && !collapsed.has(s.id)) {
    h += childLayout === 'h'
      ? `<div class="hkids">${kids.map(k => `<div class="hkid">${nodeHTML(k, depth+1, 'h')}</div>`).join('')}</div>`
      : `<div class="vkids">${kids.map(k => `<div class="vkid">${nodeHTML(k, depth+1, 'v')}</div>`).join('')}</div>`;
  }
  return h + '</div>';
}
function render(){
  let h = '';
  if (M.roots.length === 1) h += `<div class="tree">${nodeHTML(M.roots[0], 0, 'h')}</div>`;
  else if (M.roots.length) h += `<div class="tree roots">${M.roots.map(r => nodeHTML(r, 0, 'h')).join('')}</div>`;
  if (M.pendingZone.length) {
    h += `<section class="pending-zone" aria-label="Pendiente de clasificación">
      <h2>⚠ Pendiente de clasificación</h2>
      <p>Elementos del Excel sin relación jerárquica definida. No se han ubicado en la estructura.</p>
      <div class="pz-list">${M.pendingZone.map(s => nodeHTML(s, 3, 'v')).join('')}</div>
    </section>`;
  }
  if (!M.seats.length) h = `<div style="padding:40px;max-width:520px">No se han encontrado asientos en el Excel. Comprueba que existe una hoja con las columnas «Asiento» y «5 funciones principales».</div>`;
  stage.innerHTML = h;
  renderStats(); renderFilters(); renderSearchCount(); renderSaveState();
}
function renderStats(){
  const n = M.seats.length, pend = M.seats.filter(s => s.pending).length;
  const st = M.seats.map(eff);
  const asg = st.filter(p => p.status === 'assigned').length, emp = st.filter(p => p.status === 'empty').length, mul = st.filter(p => p.status === 'multi').length;
  const rev = M.seats.filter(s => issuesOf(s).some(i => i.level === 'warn')).length;
  $('#stats').innerHTML = `<b>${n}</b> asientos (${n-pend} en estructura · ${pend} pendientes de clasificación) · <b>${asg}</b> asignados · <b>${emp}</b> sin asignar${mul ? ` · <b>${mul}</b> con asignación a revisar` : ''} · <b>${rev}</b> con avisos`;
  $('#openReview').textContent = `Revisión (${rev + pend})`;
  const v = $('#version');
  v.innerHTML = (M.version ? `Versión ${esc(M.version)} · ` : '') + esc(M.raw.fileName || '') +
    (usingLoaded ? ` · <span>cargado desde el navegador</span> · <button id="useEmbedded">volver a la versión incrustada</button>` : '');
  const ue = $('#useEmbedded'); if (ue) ue.onclick = () => { LS.del(KEY_RAW); RAW = EMBEDDED; usingLoaded = false; M = buildModel(RAW); expanded.clear(); collapsed.clear(); render(); fit(); toast('Se usa de nuevo el Excel incrustado en el archivo.'); };
}
function renderFilters(){

function knownPeople(){
  const seen = new Map();
  M.seats.forEach(s => { const p = eff(s); if (p.status === 'assigned') { const k = personKey(p.name); if (!seen.has(k)) seen.set(k, personBase(p.name)); } });
  M.seats.forEach(s => { if (s.excelStatus === 'assigned') { const k = personKey(s.excelPerson); if (!seen.has(k)) seen.set(k, personBase(s.excelPerson)); } });

/* ============================================================
   Pan & zoom
   ============================================================ */
const view = { x:0, y:0, s:1 };
function applyView(anim){
  stage.classList.toggle('anim', !!anim);
  stage.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.s})`;
  $('#zl').textContent = Math.round(view.s * 100) + '%';
}
function zoomAt(cx, cy, f, anim){
  const s2 = Math.min(2, Math.max(0.2, view.s * f)); const k = s2 / view.s;
  view.x = cx - (cx - view.x) * k; view.y = cy - (cy - view.y) * k; view.s = s2; applyView(anim);
}
function fit(anim){
  const vw = viewport.clientWidth, vh = viewport.clientHeight, w = stage.offsetWidth, h = stage.offsetHeight;
  const s = Math.max(0.55, Math.min(1, vw / w, vh / h));
  view.s = s; view.x = Math.max(0, (vw - w * s) / 2); view.y = 0;
  if (w * s > vw) { // en pantallas estrechas, centrar el primer asiento de la estructura
    const c = stage.querySelector('.tree .card');
    if (c) { let x = 0, el = c; while (el && el !== stage) { x += el.offsetLeft; el = el.offsetParent; } view.x = vw / 2 - (x + c.offsetWidth / 2) * s; }
  }
  applyView(anim);
}
function focusSeat(id, anim = true){
  const el = stage.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if (!el) return;
  const r = el.getBoundingClientRect(), sr = stage.getBoundingClientRect(), vr = viewport.getBoundingClientRect();
  const ux = (r.left - sr.left) / view.s, uy = (r.top - sr.top) / view.s, uw = r.width / view.s;
  const drawerW = $('#drawer').classList.contains('open') ? Math.min(460, vr.width) : 0;
  const availW = Math.max(200, vr.width - drawerW);
  if (view.s < 0.7) view.s = 0.85;
  view.x = availW / 2 - (ux + uw / 2) * view.s;
  view.y = Math.min(vr.height * 0.25, 80) - uy * view.s;
  applyView(anim);
}
{
  const pts = new Map(); let start = null, moved = false, pinch = null;
  viewport.addEventListener('pointerdown', e => {
    if (e.target.closest('button,input,select,a,.zoom,.legend')) return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 1) { start = { x:e.clientX, y:e.clientY, vx:view.x, vy:view.y }; moved = false; }
    if (pts.size === 2) { const [a,b] = [...pts.values()]; pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), s:view.s }; }
    viewport.setPointerCapture(e.pointerId);
  });
  viewport.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if (pts.size === 2 && pinch) {
      const [a,b] = [...pts.values()], d = Math.hypot(a.x-b.x, a.y-b.y), vr = viewport.getBoundingClientRect();
      zoomAt((a.x+b.x)/2 - vr.left, (a.y+b.y)/2 - vr.top, (pinch.s * d / pinch.d) / view.s); moved = true; return;
    }
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!moved && Math.hypot(dx, dy) < 4) return;
    moved = true; viewport.classList.add('dragging');
    view.x = start.vx + dx; view.y = start.vy + dy; applyView(false);
  });
  const end = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { start = null; viewport.classList.remove('dragging'); } };
  viewport.addEventListener('pointerup', end); viewport.addEventListener('pointercancel', end);
  viewport.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);
  viewport.addEventListener('wheel', e => {
    e.preventDefault();
    const vr = viewport.getBoundingClientRect();
    if (e.ctrlKey || e.metaKey) zoomAt(e.clientX - vr.left, e.clientY - vr.top, Math.exp(-e.deltaY * 0.0022));
    else { view.x -= e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX; view.y -= e.shiftKey && !e.deltaX ? 0 : e.deltaY; applyView(false); }
  }, { passive:false });
  $('#zin').onclick = () => zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1.2, true);
  $('#zout').onclick = () => zoomAt(viewport.clientWidth/2, viewport.clientHeight/2, 1/1.2, true);
  $('#zfit').onclick = () => fit(true);
}

stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const card = b.closest('.card'); if (!card) return;
  const id = card.dataset.id, act = b.dataset.act;
  if (act === 'toggle') { expanded.has(id) ? expanded.delete(id) : expanded.add(id); render(); }
  else if (act === 'kids') { collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id); render(); }
  else if (act === 'assign') openPop(id, b);
  else if (act === 'detail') openSeatDrawer(id);
});
$('#expandAll').onclick = () => { M.seats.forEach(s => expanded.add(s.id)); collapsed.clear(); render(); };
$('#collapseAll').onclick = () => { expanded.clear(); render(); fit(true); };

$('#fPerson').onchange = e => { F.person = e.target.value; render(); };
$('#fUnassigned').onchange = e => { F.unassigned = e.target.checked; render(); };
$('#fWarn').onchange = e => { F.warn = e.target.checked; render(); };

let qt;

    <div class="pt">${p.status === 'empty' ? 'Asignar persona' : 'Cambiar persona'}</div>
    <div class="ps">${esc(s.seat)}</div>

    <div class="err" id="popErr" hidden></div>
    <div class="pw" id="popWarn" hidden></div>

    </div>
    ${s.excelPerson ? `<div class="pn">Valor en el Excel: «${esc(s.excelPerson)}»</div>` : `<div class="pn">El Excel no indica persona para este seat.</div>`}`;

  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);

  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); popSave(); } });
  $('#popSave').onclick = popSave;
  $('#popCancel').onclick = closePop;

function popSave(){
  const s = M.byId[popState.id], v = $('#popIn').value.replace(/\s+/g,' ').trim();

  const k = personKey(v);
  const others = M.seats.filter(o => o !== s && eff(o).status === 'assigned' && personKey(eff(o).name) === k);
  if (others.length && !popState.confirm) {
    const w = $('#popWarn');

}
function closePop(){ pop.hidden = true; popState = null; }
function setAssignment(id, val){

  if ((val === null && (s.excelStatus === 'empty' || s.excelStatus === 'vacant')) || (val !== null && val === excelVal)) delete overrides[id];
  else overrides[id] = { person: val };

}

  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){ drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
$('#drawerClose').onclick = closeDrawer;
const issueHTML = i => `<div class="issue ${i.level}">${esc(i.text)}${i.src ? `<span class="src">${esc(i.src)}</span>` : ''}</div>`;
function openSeatDrawer(id){
  const s = M.byId[id], p = eff(s), iss = issuesOf(s), par = s.parentId ? M.byId[s.parentId] : null;
  const kids = M.children[s.id] || [];
  const personTxt = p.status === 'assigned' ? esc(p.name) : p.status === 'multi' ? '⚠ Revisar asignación' : 'Sin asignar';
  let b = '';
  b += `<div class="kv">
    <span>Persona</span><span><b>${personTxt}</b>${p.source === 'edit' ? ' · editado en la interfaz' : ''}</span>
    <span>En el Excel</span><span>${s.excelPerson ? '«' + esc(s.excelPerson) + '»' : '<i>vacío</i>'}</span>
    <span>Reporta a</span><span>${par ? esc(par.seat) : 'Relación por definir'}${s.parentRaw && (!par || norm(par.seat) !== norm(s.parentRaw)) ? ` <i>(Excel: «${esc(s.parentRaw)}»)</i>` : ''}</span>
    ${kids.length ? `<span>Dependen</span><span>${kids.map(k => esc(k.seat)).join(' · ')}</span>` : ''}
    <span>Fila del Excel</span><span>${s.row} (hoja «${esc(M.raw.seatsSheet.name)}»)</span>
  </div>`;
  if (iss.length) b += `<h3>Avisos</h3>` + iss.map(issueHTML).join('');
  b += `<h3>5 responsabilidades</h3>`;
  b += s.respOk ? `<ol class="resp-list">${s.resp.map(x => `<li>${esc(x.text)}</li>`).join('')}</ol>`
                : `<div class="resp-bad">⚠ Revisar responsabilidades — contenido original:</div><div class="raw">${esc(s.respRaw.trim()) || '<i>(vacío)</i>'}</div>`;
  b += '<dl>' + DETAIL_FIELDS.map(([k,l]) => `<dt>${l}</dt>` + (s[k] ? `<dd>${esc(s[k])}</dd>` : '<dd class="none">No indicado en el Excel</dd>')).join('') + '</dl>';
  const head = `<div class="area" style="color:var(${s.area ? M.areaColor[s.area] : '--muted'})">${esc(s.area || (s.isLead ? 'Liderazgo · EOS' : 'Sin función principal'))}</div><h2>${esc(s.seat || '(sin nombre)')}</h2>`;
  openDrawer(head, b);
}
$('#openReview').onclick = () => {
  const seats = M.seats;
  const nResp = seats.reduce((a,s) => a + (s.respOk ? 5 : 0), 0);
  let b = `<h3>Verificación de la carga</h3><div class="kv">
    <span>Asientos leídos</span><span>${seats.length} (hoja «${esc(M.raw.seatsSheet.name)}»)</span>
    <span>En la estructura</span><span>${seats.length - M.pendingZone.length}</span>
    <span>Pendientes de clasificación</span><span>${seats.filter(s=>s.pending).length}</span>
    <span>Con exactamente 5 responsabilidades</span><span>${seats.filter(s=>s.respOk).length} de ${seats.length} (${nResp} responsabilidades)</span>
    <span>Relaciones «Reporta a» resueltas</span><span>${seats.filter(s=>s.parentId).length} de ${seats.filter(s=>s.parentRaw).length} indicadas</span>
    <span>Asignados / sin asignar</span><span>${seats.filter(s=>eff(s).status==='assigned').length} / ${seats.filter(s=>eff(s).status==='empty').length}</span>
    ${M.missingCols.length ? `<span>Columnas no encontradas</span><span>${M.missingCols.join(', ')}</span>` : ''}
  </div>`;
  const withW = seats.filter(s => issuesOf(s).some(i => i.level !== 'info'));
  b += `<h3>Avisos por asiento (${withW.length})</h3>`;
  b += withW.map(s => `<div class="rv-seat"><div class="h"><b>${esc(s.seat)}</b><button class="link" data-go="${s.id}">Ver en el chart</button></div>${issuesOf(s).filter(i=>i.level!=='info').map(issueHTML).join('')}</div>`).join('') || '<p>Sin avisos.</p>';
  const multi = new Map();
  seats.forEach(s => { const p = eff(s); if (p.status === 'assigned') { const k = personKey(p.name); if (!multi.has(k)) multi.set(k, {name:personBase(p.name), seats:[]}); multi.get(k).seats.push(s.seat); } });
  const mm = [...multi.values()].filter(x => x.seats.length > 1);
  b += `<h3>Personas en varios seats (${mm.length})</h3>` + (mm.length ? mm.map(x => `<div class="issue multi"><b>${esc(x.name)}</b>: ${x.seats.map(esc).join(' · ')}</div>`).join('') : '<p>Ninguna.</p>');
  if (M.refs.length) {
    const g = new Map(); M.refs.forEach(r => { if (!g.has(r.target)) g.set(r.target, new Set()); g.get(r.target).add(r.from.seat); });
    b += `<h3>Referencias sin asiento correspondiente</h3><p style="font-size:12.5px;color:var(--muted);margin:0 0 6px">Nombres usados en «Qué NO incluye» que no coinciden literalmente con ningún asiento del Excel. No se han vinculado.</p>` +
      [...g.entries()].map(([t, from]) => `<div class="issue info">«${esc(t)}» <span class="src">en: ${[...from].map(esc).join(' · ')}</span></div>`).join('');
  }
  const infos = seats.map(s => [s, s.issues.filter(i => i.level === 'info')]).filter(([,l]) => l.length);
  if (infos.length) b += `<h3>Notas informativas</h3>` + infos.map(([s,l]) => `<div class="issue info"><b>${esc(s.seat)}</b> — ${l.map(i=>esc(i.text)).join(' ')}</div>`).join('');
  openDrawer('<div class="area">Control de calidad EOS</div><h2>Revisión del chart</h2>', b);
};
$('#drawerBody').addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (!g) return; const id = g.dataset.go; let p = M.byId[id].parentId; while (p) { collapsed.delete(p); p = M.byId[p].parentId; } render(); focusSeat(id); flash(id); });
function flash(id){ const el = stage.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if (!el) return; el.classList.add('hit','cur'); setTimeout(() => { el.classList.remove('cur'); if (!hits.some(h => h.id === id)) el.classList.remove('hit'); }, 1600); }
$('#openGuide').onclick = () => {
  const g = M.raw.guideSheet;
  if (!g || !g.rows.length) { openDrawer('<h2>Guía</h2>', '<p>El Excel no contiene hoja de guía.</p>'); return; }
  const b = g.rows.map(r => {
    const c = r.map(x => String(x ?? '').trim()).filter(Boolean);
    if (!c.length) return '';
    if (c.length === 1) return /^(\d+\.\s|[A-ZÁÉÍÓÚÑ0-9 ·:¿?«»\-]{8,}$)/.test(c[0]) ? `<div class="guide-h">${esc(c[0])}</div>` : `<p class="guide-p">${esc(c[0])}</p>`;
    return `<div class="guide-row${c.length > 2 ? ' three' : ''}">${c.slice(0,3).map(x => `<div>${esc(x)}</div>`).join('')}</div>`;
  }).join('');
  openDrawer(`<div class="area">Hoja «${esc(g.name)}» del Excel</div><h2>Guía del Accountability Chart</h2>`, b);
};

/* ============================================================
   Sustituir el Excel (opcional: descarga la librería SheetJS)
   ============================================================ */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('no se pudo descargar el lector de Excel (se necesita conexión a internet)')); document.head.append(s); }); }
$('#loadXlsx').onclick = () => $('#xlsxFile').click();
$('#xlsxFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
    const toRows = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:'', raw:false, blankrows:false });
    const seatsName = wb.SheetNames.find(n => (toRows(n)[0] || []).some(h => ['asiento','seat'].includes(norm(h))));
    if (!seatsName) throw new Error('no se encontró ninguna hoja con la columna «Asiento»');
    const gName = wb.SheetNames.find(n => n !== seatsName && /descrip|gu[ií]a/i.test(n));
    const raw = { fileName:f.name, seatsSheet:{ name:seatsName, rows:toRows(seatsName) }, guideSheet: gName ? { name:gName, rows:toRows(gName).filter(r => r.some(v => String(v).trim())) } : null };
    const m = buildModel(raw);
    if (!m.seats.length) throw new Error('la hoja no contiene asientos');
    RAW = raw; M = m; usingLoaded = true; LS.set(KEY_RAW, JSON.stringify(raw));
    expanded.clear(); collapsed.clear(); Q = ''; $('#q').value = ''; hits = [];
    render(); fit(true); toast(`Cargado «${f.name}»: ${m.seats.length} asientos.`, 3500);
  } catch(err) { alert('No se pudo cargar el Excel: ' + err.message + '.'); }
};

/* ---------- varios ---------- */
let tt; function toast(t, ms = 2400){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), ms); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!pop.hidden) closePop(); else if (drawer.classList.contains('open')) closeDrawer(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); }
});

render();
requestAnimationFrame(() => fit(false));
})();
</script>
