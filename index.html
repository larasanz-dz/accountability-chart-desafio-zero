function popSave(){
  const s = M.byId[popState.id], v = $('#popIn').value.replace(/\s+/g,' ').trim();
  if (!v) { const er = $('#popErr'); er.textContent = 'Escribe un nombre o usa «Quitar asignación».'; er.hidden = false; return; }
  const k = personKey(v);
  const others = M.seats.filter(o => o !== s && eff(o).status === 'assigned' && personKey(eff(o).name) === k);
  if (others.length && !popState.confirm) {
    const w = $('#popWarn');
    w.innerHTML = `<strong>Esta persona ya está asignada a otro seat.</strong><br>Ocupa: ${others.map(o => '«' + esc(o.seat) + '»').join(', ')}.<br>Una persona puede ocupar varios seats; decide si mantener también esta asignación.`;
    w.hidden = false; popState.confirm = true; $('#popSave').textContent = 'Asignar igualmente'; return;
  }
  setAssignment(s.id, v); closePop(); toast(`«${v}» asignado a «${s.seat}».`);
}
function closePop(){ pop.hidden = true; popState = null; }
function setAssignment(id, val){
  const s = M.byId[id];
  const excelVal = s.excelStatus === 'assigned' ? s.excelPerson : null;
  if ((val === null && (s.excelStatus === 'empty' || s.excelStatus === 'vacant')) || (val !== null && val === excelVal)) delete overrides[id];
  else overrides[id] = { person: val };
  dirty = true; render();
}
document.addEventListener('pointerdown', e => { if (!pop.hidden && !pop.contains(e.target) && !e.target.closest('[data-act="assign"]')) closePop(); });
$('#save').onclick = () => {
  const ok = LS.set(KEY_ASSIGN, JSON.stringify({ savedAt:new Date().toISOString(), source:M.raw.fileName, assignments:overrides }));
  if (ok) { dirty = false; renderSaveState(); toast('Asignaciones guardadas en este navegador.'); }
  else toast('Este navegador no permite guardar localmente. Usa «Exportar» para conservar las asignaciones.', 4200);
};
$('#reset').onclick = () => {
  if (!confirm('¿Restablecer las asignaciones del Excel?\nSe descartan todas las asignaciones hechas desde la interfaz (también las guardadas en este navegador).')) return;
  overrides = {}; LS.del(KEY_ASSIGN); dirty = false; render(); toast('Asignaciones restablecidas al estado del Excel.');
};
$('#export').onclick = () => {
  const q = v => '"' + String(v ?? '').replace(/"/g,'""') + '"';
  const lines = [['Función principal','Asiento','Persona','Origen','Valor en el Excel'].map(q).join(';')];
  M.seats.forEach(s => { const p = eff(s); lines.push([s.area, s.seat, p.status === 'assigned' || p.status === 'multi' ? p.name : '', p.source === 'edit' ? 'Editado en la interfaz' : 'Excel', s.excelPerson].map(q).join(';')); });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'asignaciones-accountability-chart.csv'; document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
};
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ============================================================
   Panel lateral: detalle, revisión, guía
   ============================================================ */
const drawer = $('#drawer');
function openDrawer(head, body){
  $('#drawerHead').innerHTML = head; $('#drawerBody').innerHTML = body; $('#drawerBody').scrollTop = 0;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){ drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
$('#drawerClose').onclick = closeDrawer;
const issueHTML = i => `<div class="issue ${i.level}">${esc(i.text)}${i.src ? `<span class="src">${esc(i.src)}</span>` : ''}</div>`;
function openSeatDrawer(id){
  const s = M.byId[id], p = eff(s), iss = issuesOf(s), par = s.parentId ? M.byId[s.parentId] : null;
  const kids = M.children[s.id] || [];
  const personTxt = p.status === 'assigned' ? esc(p.name) : p.status === 'multi' ? esc((s.people || [p.name]).join(', ')) + ' <i>(varias personas)</i>' : 'Sin asignar';
  let b = '';
  b += `<div class="kv">
    <span>Persona</span><span><b>${personTxt}</b>${p.source === 'edit' ? ' · editado en la interfaz' : ''}</span>
    <span>En el Excel</span><span>${s.excelPerson ? '«' + esc(s.excelPerson) + '»' : '<i>vacío</i>'}</span>
    <span>Reporta a</span><span>${par ? esc(par.seat) : 'Relación por definir'}${s.parentRaw && (!par || norm(par.seat) !== norm(s.parentRaw)) ? ` <i>(Excel: «${esc(s.parentRaw)}»)</i>` : ''}</span>
    ${kids.length ? `<span>Dependen</span><span>${kids.map(k => esc(k.seat)).join(' · ')}</span>` : ''}
    <span>Fila del Excel</span><span>${s.row} (hoja «${esc(M.raw.seatsSheet.name)}»)</span>
  </div>`;
  if (iss.length) b += `<h3>Avisos</h3>` + iss.map(issueHTML).join('');
  b += `<h3>5 roles del asiento</h3>`;
  b += s.respOk ? `<ol class="resp-list">${s.resp.map(x => `<li>${esc(x.text)}</li>`).join('')}</ol>`
                : `<div class="resp-bad">⚠ Revisar roles — contenido original:</div><div class="raw">${esc(s.respRaw.trim()) || '<i>(vacío)</i>'}</div>`;
  b += '<dl>' + DETAIL_FIELDS.map(([k,l]) => `<dt>${l}</dt>` + (s[k] ? `<dd>${esc(s[k])}</dd>` : '<dd class="none">No indicado en el Excel</dd>')).join('') + '</dl>';
  const head = `<div class="area" style="color:var(${s.area ? M.areaColor[s.area] : '--muted'})">${esc(s.area || (s.isLead ? 'Liderazgo · EOS' : 'Sin función principal'))}</div><h2>${esc(s.seat || '(sin nombre)')}</h2>`;
  openDrawer(head, b);
}
$('#openReview').onclick = () => {
  const seats = M.seats;
  const nResp = seats.reduce((a,s) => a + (s.respOk ? 5 : 0), 0);
  let b = `<h3>Verificación de la carga</h3><div class="kv">
    <span>Asientos leídos</span><span>${seats.length} (hoja «${esc(M.raw.seatsSheet.name)}»)</span>
    <span>En la estructura</span><span>${seats.length - M.pendingZone.length - M.undefinedZone.length}</span>
    <span>Pendientes de clasificación</span><span>${seats.filter(s=>s.pending).length}</span>
    <span>Con exactamente 5 roles</span><span>${seats.filter(s=>s.respOk).length} de ${seats.length} (${nResp} roles)</span>
    <span>Relaciones «Reporta a» resueltas</span><span>${seats.filter(s=>s.parentId).length} de ${seats.filter(s=>s.parentRaw).length} indicadas</span>
    <span>Asignados / sin asignar</span><span>${seats.filter(s=>eff(s).status==='assigned').length} / ${seats.filter(s=>eff(s).status==='empty').length}</span>
    ${M.missingCols.length ? `<span>Columnas no encontradas</span><span>${M.missingCols.join(', ')}</span>` : ''}
  </div>`;
  const withW = seats.filter(s => issuesOf(s).some(i => i.level !== 'info'));
  b += `<h3>Avisos por asiento (${withW.length})</h3>`;
  b += withW.map(s => `<div class="rv-seat"><div class="h"><b>${esc(s.seat)}</b><button class="link" data-go="${s.id}">Ver en el chart</button></div>${issuesOf(s).filter(i=>i.level!=='info').map(issueHTML).join('')}</div>`).join('') || '<p>Sin avisos.</p>';
  const multi = new Map();
  seats.forEach(s => { const p = eff(s); if (p.status === 'assigned') { const k = personKey(p.name); if (!multi.has(k)) multi.set(k, {name:personBase(p.name), seats:[]}); multi.get(k).seats.push(s.seat); } });
  const mm = [...multi.values()].filter(x => x.seats.length > 1);
  b += `<h3>Personas en varios seats (${mm.length})</h3>` + (mm.length ? mm.map(x => `<div class="issue multi"><b>${esc(x.name)}</b>: ${x.seats.map(esc).join(' · ')}</div>`).join('') : '<p>Ninguna.</p>');
  if (M.refs.length) {
    const g = new Map(); M.refs.forEach(r => { if (!g.has(r.target)) g.set(r.target, new Set()); g.get(r.target).add(r.from.seat); });
    b += `<h3>Referencias sin asiento correspondiente</h3><p style="font-size:12.5px;color:var(--muted);margin:0 0 6px">Nombres usados en «Qué NO incluye» que no coinciden literalmente con ningún asiento del Excel. No se han vinculado.</p>` +
      [...g.entries()].map(([t, from]) => `<div class="issue info">«${esc(t)}» <span class="src">en: ${[...from].map(esc).join(' · ')}</span></div>`).join('');
  }
  const infos = seats.map(s => [s, s.issues.filter(i => i.level === 'info')]).filter(([,l]) => l.length);
  if (infos.length) b += `<h3>Notas informativas</h3>` + infos.map(([s,l]) => `<div class="issue info"><b>${esc(s.seat)}</b> — ${l.map(i=>esc(i.text)).join(' ')}</div>`).join('');
  openDrawer('<div class="area">Control de calidad EOS</div><h2>Revisión del chart</h2>', b);
};
$('#drawerBody').addEventListener('click', e => { const g = e.target.closest('[data-go]'); if (!g) return; const id = g.dataset.go; let p = M.byId[id].parentId; while (p) { collapsed.delete(p); p = M.byId[p].parentId; } render(); focusSeat(id); flash(id); });
function flash(id){ const el = stage.querySelector(`.card[data-id="${CSS.escape(id)}"]`); if (!el) return; el.classList.add('hit','cur'); setTimeout(() => { el.classList.remove('cur'); if (!hits.some(h => h.id === id)) el.classList.remove('hit'); }, 1600); }
/* ============================================================
   Guía (hoja «Descripción» del Excel) como pestaña propia.
   Se maqueta a partir de la estructura de filas de la hoja; el texto no se modifica.
   ============================================================ */
const GV_SECTION = /^(\d+\.\s|[A-ZÁÉÍÓÚÑÜ0-9 ·:¿?«»\-\.]{8,}$)/;
function renderChain(txt){
  const parts = txt.split('→').map(s => s.trim()).filter(Boolean);
  if (parts.length < 3) return esc(txt);
  return `<div class="gv-chain">${parts.map(p => `<span>${esc(p)}</span>`).join('<i>→</i>')}</div>`;
}
function renderGuide(){
  const view = $('#guideView');
  const g = M.raw.guideSheet;
  if (!g || !g.rows || !g.rows.some(r => r.some(x => String(x ?? '').trim()))) {
    view.innerHTML = '<div class="gv-empty">El Excel no contiene hoja de guía.</div>'; return;
  }
  const rows = g.rows.map(r => r.map(x => String(x ?? '').trim()).filter(Boolean)).filter(c => c.length);
  let i = 0, title = '', lead = '';
  if (rows[0] && rows[0].length === 1 && GV_SECTION.test(rows[0][0]) && !/^\d+\./.test(rows[0][0])) { title = rows[0][0]; i = 1; }
  if (rows[i] && rows[i].length === 1 && !GV_SECTION.test(rows[i][0])) { lead = rows[i][0]; i++; }
  const sections = []; let cur = null;
  for (; i < rows.length; i++) {
    const c = rows[i];
    if (c.length === 1 && GV_SECTION.test(c[0]) && !c[0].startsWith('□')) { cur = { title: c[0], rows: [] }; sections.push(cur); continue; }
    if (!cur) { cur = { title: '', rows: [] }; sections.push(cur); }
    cur.rows.push(c);
  }
  const block = rs => {
    let out = '', k = 0;
    while (k < rs.length) {
      const c = rs[k];
      if (c.length === 1) {
        if (c[0].startsWith('□')) {
          let items = []; while (k < rs.length && rs[k].length === 1 && rs[k][0].startsWith('□')) items.push(rs[k++][0].replace(/^□\s*/, ''));
          out += `<ul class="gv-check">${items.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`; continue;
        }
        const s = c[0];
        if (/^importante\b/i.test(s)) out += `<div class="gv-callout">${esc(s)}</div>`;
        else if (/^(nota\b|por eso\b|el tipo no\b)/i.test(s)) out += `<p class="gv-note">${esc(s)}</p>`;
        else out += `<p>${esc(s)}</p>`;
        k++; continue;
      }
      const n = c.length; const grp = [];
      while (k < rs.length && rs[k].length === n) grp.push(rs[k++]);
      if (n === 3 && grp.every(r => /^\d+$/.test(r[0]))) {
        out += `<ol class="gv-steps">${grp.map(r => `<li><span class="n">${esc(r[0])}</span><div><b>${esc(r[1])}</b>${esc(r[2])}</div></li>`).join('')}</ol>`; continue;
      }
      const hasHead = grp.length >= 3 && grp[0].every(x => x.length <= 22);
      const head = hasHead ? grp.shift() : null;
      out += `<table class="gv-table">${head ? `<thead><tr>${head.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead>` : ''}<tbody>${
        grp.map(r => `<tr>${r.map((x, j) => `<td>${j > 0 ? renderChain(x) : esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    }
    return out;
  };
  const toc = sections.filter(s => /^\d+\./.test(s.title));
  view.innerHTML = `<div class="gv">
    <h2 class="gv-title">${esc(title || 'Guía del Accountability Chart')}</h2>
    <div class="gv-src">Hoja «${esc(g.name)}» del Excel · ${esc(M.raw.fileName || '')}</div>
    ${lead ? `<div class="gv-lead">${esc(lead)}</div>` : ''}
    ${toc.length ? `<div class="gv-toc">${toc.map(s => `<button type="button" data-sec="${sections.indexOf(s)}">${esc(s.title)}</button>`).join('')}</div>` : ''}
    ${sections.map((s, idx) => `<section class="gv-sec${/^REGLA/i.test(s.title) ? ' gv-rule' : ''}" id="gv-sec-${idx}">${s.title ? `<h3>${esc(s.title)}</h3>` : ''}${block(s.rows)}</section>`).join('')}
  </div>`;
}
$('#guideView').addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) document.getElementById('gv-sec-' + b.dataset.sec).scrollIntoView({ behavior:'smooth', block:'start' }); });

const KEY_TAB = 'acdz.tab.v1';
let fitted = false;
function setTab(tab){
  const guide = tab === 'guide';
  $('#tabGuide').setAttribute('aria-selected', guide); $('#tabChart').setAttribute('aria-selected', !guide);
  $('#guideView').hidden = !guide; $('#viewport').hidden = guide; $('#toolbar').hidden = guide;
  document.body.classList.toggle('guide-mode', guide);
  LS.set(KEY_TAB, tab);
  if (guide) { closeDrawer(); renderGuide(); }
  else if (!fitted) { fitted = true; requestAnimationFrame(() => fit(false)); }
}
document.querySelectorAll('.tab').forEach(b => b.onclick = () => setTab(b.dataset.tab));

/* ============================================================
   Sustituir el Excel (opcional: descarga la librería SheetJS)
   ============================================================ */
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('no se pudo descargar el lector de Excel (se necesita conexión a internet)')); document.head.append(s); }); }
$('#loadXlsx').onclick = () => $('#xlsxFile').click();
$('#xlsxFile').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    if (!window.XLSX) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb = XLSX.read(await f.arrayBuffer(), { type:'array' });
    const toRows = n => XLSX.utils.sheet_to_json(wb.Sheets[n], { header:1, defval:'', raw:false, blankrows:false });
    const seatsName = wb.SheetNames.find(n => (toRows(n)[0] || []).some(h => ['asiento','seat'].includes(norm(h))));
    if (!seatsName) throw new Error('no se encontró ninguna hoja con la columna «Asiento»');
    const gName = wb.SheetNames.find(n => n !== seatsName && /descrip|gu[ií]a/i.test(n));
    const raw = { fileName:f.name, seatsSheet:{ name:seatsName, rows:toRows(seatsName) }, guideSheet: gName ? { name:gName, rows:toRows(gName).filter(r => r.some(v => String(v).trim())) } : null };
    const m = buildModel(raw);
    if (!m.seats.length) throw new Error('la hoja no contiene asientos');
    RAW = raw; M = m; usingLoaded = true; LS.set(KEY_RAW, JSON.stringify(raw));
    expanded.clear(); collapsed.clear(); Q = ''; $('#q').value = ''; hits = [];
    render(); fit(true); toast(`Cargado «${f.name}»: ${m.seats.length} asientos.`, 3500);
  } catch(err) { alert('No se pudo cargar el Excel: ' + err.message + '.'); }
};

/* ---------- varios ---------- */
let tt; function toast(t, ms = 2400){ const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), ms); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!pop.hidden) closePop(); else if (drawer.classList.contains('open')) closeDrawer(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); $('#q').focus(); }
});

render();
setTab(LS.get(KEY_TAB) || 'guide');
})();
</script>
